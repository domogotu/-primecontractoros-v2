name: Phase 3 clean release consolidation
on:
  push:
    branches: [agent/phase3-clean-release-work]
permissions:
  contents: write
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: primecontractoros_test
          MYSQL_USER: user
          MYSQL_PASSWORD: pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uuser -ppass"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: mysql://user:pass@127.0.0.1:3306/primecontractoros_test
      JWT_SECRET: phase3-validation-only-not-a-secret
      VITE_APP_ID: phase3-validation
      OAUTH_SERVER_URL: https://example.invalid
      VITE_OAUTH_PORTAL_URL: https://example.invalid
      OWNER_OPEN_ID: phase3-owner
      OWNER_NAME: Phase3 Owner
      OPENAI_API_KEY: sk-test-dummy-phase3-validation
      SAM_GOV_API_KEY: phase3-test
      STRIPE_SECRET_KEY: sk_test_phase3_validation
      STRIPE_PUBLISHABLE_KEY: pk_test_phase3_validation
      STRIPE_WEBHOOK_SECRET: whsec_phase3_validation
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase3-clean-release-work
          fetch-depth: 0
      - name: Consolidate audit log and lifecycle cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('client/src/pages/AuditLog.tsx')
          s = p.read_text()
          s = s.replace('// @ts-nocheck\n','',1)
          s = s.replace('import { useLocation } from "wouter";\n','')
          s = s.replace('import { useAuth } from "@/_core/hooks/useAuth";\n','')
          s = s.replace('import { Badge } from "@/components/ui/badge";\n','')
          s = s.replace('  const { user } = useAuth();\n  const [, setLocation] = useLocation();\n','')
          old = '''  const handleExport = () => {\n    toast({\n      title: "Export Started",\n      description: "Audit log export is being generated. You will be notified when it's ready.",\n    });\n  };'''
          new = '''  const handleExport = () => {\n    if (filteredLogs.length === 0) {\n      toast({ title: "Nothing to export", description: "No audit records match the current filters." });\n      return;\n    }\n    const escapeCsv = (value: unknown) => {\n      const text = value == null ? "" : typeof value === "string" ? value : JSON.stringify(value);\n      return `"${text.replace(/"/g, '\"\"')}"`;\n    };\n    const rows = filteredLogs.map((log) => [log.id, log.timestamp, log.userId, log.action, log.entity, log.entityId, log.changes]);\n    const csv = [["Event ID", "Timestamp", "User ID", "Action", "Record Type", "Record ID", "Changes"], ...rows]\n      .map(row => row.map(escapeCsv).join(",")).join("\\n");\n    const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });\n    const url = URL.createObjectURL(blob);\n    const link = document.createElement("a");\n    link.href = url;\n    link.download = `primecontractoros-audit-log-${new Date().toISOString().slice(0, 10)}.csv`;\n    document.body.appendChild(link);\n    link.click();\n    link.remove();\n    URL.revokeObjectURL(url);\n    toast({ title: "Export complete", description: `${filteredLogs.length} audit records exported as CSV.` });\n  };'''
          if old not in s:
              raise SystemExit('audit export placeholder not found')
          s = s.replace(old,new)
          old = '''  const getActionColor = (action: string) => {\n    switch (action) {\n      case "CREATE": return "green";\n      case "UPDATE": return "blue";\n      case "DELETE": return "red";\n      case "STATUS_CHANGE": return "yellow";\n      case "LOGIN": return "purple";\n      default: return "gray";\n    }\n  };'''
          new = '''  const getActionClass = (action: string) => {\n    switch (action) {\n      case "create": return "bg-green-100 text-green-800 dark:bg-green-900/30 dark:text-green-400";\n      case "update": return "bg-blue-100 text-blue-800 dark:bg-blue-900/30 dark:text-blue-400";\n      case "delete": return "bg-red-100 text-red-800 dark:bg-red-900/30 dark:text-red-400";\n      case "archive": return "bg-yellow-100 text-yellow-800 dark:bg-yellow-900/30 dark:text-yellow-400";\n      case "restore": return "bg-purple-100 text-purple-800 dark:bg-purple-900/30 dark:text-purple-400";\n      default: return "bg-gray-100 text-gray-800 dark:bg-gray-900/30 dark:text-gray-400";\n    }\n  };'''
          if old not in s:
              raise SystemExit('action color block not found')
          s = s.replace(old,new)
          s = s.replace('const matchesAction = actionFilter === "ALL" || log.action.toUpperCase() === actionFilter;', 'const matchesAction = actionFilter === "all" || log.action === actionFilter;')
          s = s.replace('useState("ALL")','useState("all")')
          s = s.replace('"Expand individual records to see exact before/after values"','"Expand individual records to inspect the recorded change payload"')
          s = s.replace('          alerts={[\n            { type: "info", message: "Audit logs are retained for 7 years to meet DCAA compliance requirements." }\n          ]}\n','')
          s = s.replace('Security Events (30d)','Events (30d)')
          s = s.replace('placeholder="Search by user, record, or details..."','placeholder="Search by record, action, or details..."')
          s = s.replace('<SelectItem value="ALL">All Actions</SelectItem>\n                    <SelectItem value="CREATE">Create</SelectItem>\n                    <SelectItem value="UPDATE">Update</SelectItem>\n                    <SelectItem value="DELETE">Delete</SelectItem>\n                    <SelectItem value="STATUS_CHANGE">Status Change</SelectItem>\n                    <SelectItem value="LOGIN">Login</SelectItem>', '<SelectItem value="all">All Actions</SelectItem>\n                    <SelectItem value="create">Create</SelectItem>\n                    <SelectItem value="update">Update</SelectItem>\n                    <SelectItem value="delete">Delete</SelectItem>\n                    <SelectItem value="archive">Archive</SelectItem>\n                    <SelectItem value="restore">Restore</SelectItem>')
          s = s.replace('className={`px-2 py-0.5 rounded-full text-xs font-medium bg-${getActionColor(log.action)}-100 text-${getActionColor(log.action)}-800 dark:bg-${getActionColor(log.action)}-900/30 dark:text-${getActionColor(log.action)}-400`}', 'className={`px-2 py-0.5 rounded-full text-xs font-medium ${getActionClass(log.action)}`}')
          old = '''                              <div className="grid grid-cols-3 gap-2">\n                                <span className="text-muted-foreground">IP Address:</span>\n                                <span className="col-span-2 font-mono text-foreground">{log.ip}</span>\n                              </div>\n                              <div className="grid grid-cols-3 gap-2">\n                                <span className="text-muted-foreground">User Email:</span>\n                                <span className="col-span-2 text-foreground">{log.userEmail}</span>\n                              </div>'''
          s = s.replace(old,'')
          old = '''                            <h4 className="text-sm font-medium text-foreground mb-2">Data Changes</h4>\n                            <div className="grid grid-cols-2 gap-4">\n                              <div className="bg-background border border-border rounded p-3">\n                                <div className="text-xs font-medium text-muted-foreground mb-2 uppercase tracking-wider">Before</div>\n                                <pre className="text-xs text-red-400 overflow-x-auto">\n                                  {log.before ? JSON.stringify(log.before, null, 2) : "null"}\n                                </pre>\n                              </div>\n                              <div className="bg-background border border-border rounded p-3">\n                                <div className="text-xs font-medium text-muted-foreground mb-2 uppercase tracking-wider">After</div>\n                                <pre className="text-xs text-green-400 overflow-x-auto">\n                                  {log.after ? JSON.stringify(log.after, null, 2) : "null"}\n                                </pre>\n                              </div>\n                            </div>'''
          new = '''                            <h4 className="text-sm font-medium text-foreground mb-2">Recorded Changes</h4>\n                            <pre className="text-xs text-foreground overflow-x-auto bg-background border border-border rounded p-3">\n                              {log.changes || "No change payload recorded."}\n                            </pre>'''
          if old not in s:
              raise SystemExit('unsupported audit detail block not found')
          s = s.replace(old,new)
          p.write_text(s)

          p = Path('server/routers.ts')
          s = p.read_text()
          s = s.replace('deliverables: z.boolean().default(false),','deliverables: z.boolean().default(true),')
          s = s.replace('const cf = input.carryForward || { contacts: true, files: true, notes: true, tasks: false, deliverables: false };','const cf = input.carryForward || { contacts: true, files: true, notes: true, tasks: false, deliverables: true };')
          marker = '''          if (cf.tasks) {\n            const linked = await db.select().from(tasksTbl).where(andOp(eqOp(tasksTbl.workspaceId, wsId), eqOp(tasksTbl.linkedRecordType, "proposal"), eqOp(tasksTbl.linkedRecordId, input.proposalId), eqOp(tasksTbl.status, "todo")));\n            for (const t of linked) {\n              await db.insert(tasksTbl).values({ workspaceId: wsId, title: t.title, description: t.description, assignedTo: t.assignedTo, linkedRecordType: "contract", linkedRecordId: contractId, priority: t.priority, dueDate: t.dueDate });\n            }\n          }'''
          replacement = marker + '''\n          if (cf.deliverables) {\n            await db.insert(tasksTbl).values({\n              workspaceId: wsId,\n              title: "Establish contract deliverables from governing award",\n              description: "Review the awarded contract, proposal requirements, amendments, and acceptance terms. Create contract deliverable records only after confirming the governing award requirements; proposal records are not treated as contract deliverables automatically.",\n              linkedRecordType: "contract",\n              linkedRecordId: contractId,\n              priority: "high",\n              status: "todo",\n            });\n          }'''
          if marker not in s:
              raise SystemExit('contract task carry-forward block not found')
          s = s.replace(marker,replacement,1)
          s = s.replace('return { success: true, contractId: contractId };','return { success: true, contractId, deliverablesPendingAwardReview: cf.deliverables };',1)
          p.write_text(s)
          PY
      - name: Verify cleanup assertions
        run: |
          ! grep -q '@ts-nocheck' client/src/pages/AuditLog.tsx
          ! grep -q 'Export Started\|being generated\|log.ip\|log.userEmail\|log.before\|log.after' client/src/pages/AuditLog.tsx
          grep -q 'text/csv' client/src/pages/AuditLog.tsx
          grep -q 'value="archive"' client/src/pages/AuditLog.tsx
          grep -q 'Establish contract deliverables from governing award' server/routers.ts
          grep -q 'deliverablesPendingAwardReview' server/routers.ts
      - run: corepack enable && corepack prepare pnpm@10.4.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm drizzle-kit migrate
      - run: pnpm check
      - run: env -u RESEND_API_KEY pnpm test
      - run: pnpm build
      - name: Remove temporary Phase 3 mutation workflows and commit clean release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/phase3-*.yml
          git add client/src/pages/AuditLog.tsx server/routers.ts
          git commit -m "fix(phase3): consolidate clean release and real audit export"
          git push origin HEAD:agent/phase3-clean-release-work
