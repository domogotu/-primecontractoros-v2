name: One-time lessons client submit link type repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize Lessons linked record type before submit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('client/src/pages/LessonsLearned.tsx')
          text = path.read_text()

          old_submit = '''    if (editingLesson) {
      updateMutation.mutate({ id: editingLesson.id, ...formData, linkedRecordId: formData.linkedRecordId || undefined });
    } else {
      createMutation.mutate({ ...formData, linkedRecordId: formData.linkedRecordId || undefined });
    }
'''
          new_submit = '''    const linkedRecordType = formData.linkedRecordType || undefined;
    if (editingLesson) {
      updateMutation.mutate({ id: editingLesson.id, ...formData, linkedRecordType, linkedRecordId: formData.linkedRecordId || undefined });
    } else {
      createMutation.mutate({ ...formData, linkedRecordType, linkedRecordId: formData.linkedRecordId || undefined });
    }
'''
          if old_submit not in text:
            raise SystemExit('Lessons handleSubmit anchor not found')
          text = text.replace(old_submit, new_submit, 1)

          old_select = '''                  const val = v === "none" ? "" : v;
                  setFormData({ ...formData, linkedRecordType: val, linkedRecordId: undefined, linkedRecordTitle: "" });
                  setLinkRecordType(val);
'''
          new_select = '''                  const val = (v === "none" ? "" : v) as "" | "contract" | "proposal" | "opportunity";
                  setFormData({ ...formData, linkedRecordType: val, linkedRecordId: undefined, linkedRecordTitle: "" });
                  setLinkRecordType(val);
'''
          if old_select not in text:
            raise SystemExit('Lessons linked record select anchor not found')
          text = text.replace(old_select, new_select, 1)

          path.write_text(text)
          PY

      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/src/pages/LessonsLearned.tsx
          if git diff --cached --quiet; then
            echo 'No repair needed.'
          else
            git commit -m 'fix(lessons): normalize linked record type before submit'
            git push origin HEAD:main
          fi
