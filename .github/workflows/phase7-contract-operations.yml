name: Phase 7 contract operations

on:
  push:
    branches:
      - agent/phase7-contract-operations
    paths:
      - .github/workflows/phase7-contract-operations.yml
      - scripts/phase7_mount.py
      - server/contractOperationsRouter.ts
      - server/phase7ContractOperations.test.ts

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: primecontractoros_test
          MYSQL_USER: user
          MYSQL_PASSWORD: pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uuser -ppass"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: mysql://user:pass@127.0.0.1:3306/primecontractoros_test
      JWT_SECRET: phase7-validation-only
      VITE_APP_ID: phase7-validation
      OAUTH_SERVER_URL: https://example.invalid
      VITE_OAUTH_PORTAL_URL: https://example.invalid
      OWNER_OPEN_ID: phase7-owner
      OWNER_NAME: Phase7 Owner
      OPENAI_API_KEY: sk-test-dummy
      SAM_GOV_API_KEY: phase7-test
      STRIPE_SECRET_KEY: sk_test_phase7
      STRIPE_PUBLISHABLE_KEY: pk_test_phase7
      STRIPE_WEBHOOK_SECRET: whsec_phase7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase7-contract-operations
          fetch-depth: 0
      - name: Apply Phase 7 integration
        run: python scripts/phase7_mount.py
      - name: Verify Phase 7 source assertions
        run: |
          grep -q 'contractOperations: contractOperationsRouter' server/routers.ts
          grep -q 'trpc.contractOperations.summary.useQuery' client/src/pages/ContractHubDetail.tsx
          grep -q 'requiresManualConfirmation: true' server/contractOperationsRouter.ts
          grep -q 'enforceAction(userId, "manage_contracts")' server/contractOperationsRouter.ts
      - run: corepack enable && corepack prepare pnpm@10.4.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm drizzle-kit migrate
      - run: pnpm check
      - run: env -u RESEND_API_KEY pnpm test
      - run: pnpm build
      - name: Commit verified Phase 7 application changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/phase7-contract-operations.yml scripts/phase7_mount.py
          git add server/routers.ts client/src/pages/ContractHubDetail.tsx server/contractOperationsRouter.ts server/phase7ContractOperations.test.ts
          git commit -m "feat(phase7): add contract operations readiness"
          git push origin HEAD:agent/phase7-contract-operations
