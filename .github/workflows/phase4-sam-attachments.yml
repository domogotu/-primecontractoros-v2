name: Phase 4 SAM attachment persistence

on:
  push:
    branches: [agent/phase4-opportunity-intake]
    paths: [.github/workflows/phase4-sam-attachments.yml]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: primecontractoros_test
          MYSQL_USER: user
          MYSQL_PASSWORD: pass
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uuser -ppass"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: mysql://user:pass@127.0.0.1:3306/primecontractoros_test
      JWT_SECRET: phase4-validation-only
      VITE_APP_ID: phase4-validation
      OAUTH_SERVER_URL: https://example.invalid
      VITE_OAUTH_PORTAL_URL: https://example.invalid
      OWNER_OPEN_ID: phase4-owner
      OWNER_NAME: Phase4 Owner
      OPENAI_API_KEY: sk-test-dummy
      SAM_GOV_API_KEY: phase4-test
      STRIPE_SECRET_KEY: sk_test_phase4
      STRIPE_PUBLISHABLE_KEY: pk_test_phase4
      STRIPE_WEBHOOK_SECRET: whsec_phase4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase4-opportunity-intake
          fetch-depth: 0

      - name: Add controlled SAM attachment persistence
        run: |
          cat > server/services/samAttachmentStorage.ts <<'EOF'
          import { storagePut } from "../storage";

          const MAX_ATTACHMENT_BYTES = 25 * 1024 * 1024;
          const FETCH_TIMEOUT_MS = 20_000;

          const ALLOWED_CONTENT_TYPES = new Set([
            "application/pdf",
            "application/zip",
            "application/x-zip-compressed",
            "application/msword",
            "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
            "application/vnd.ms-excel",
            "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
            "text/plain",
            "text/csv",
            "application/octet-stream",
          ]);

          export interface PersistSamAttachmentInput {
            workspaceId: number;
            opportunityId: number;
            fileName: string;
            sourceUrl: string;
            declaredType?: string | null;
          }

          export interface PersistSamAttachmentResult {
            downloaded: boolean;
            storagePath?: string;
            contentType?: string;
            sizeBytes?: number;
            warning?: string;
          }

          function safeFileName(name: string): string {
            return (name || "attachment")
              .replace(/[^a-zA-Z0-9._-]+/g, "_")
              .replace(/^_+|_+$/g, "")
              .slice(0, 180) || "attachment";
          }

          export function isAllowedSamAttachmentUrl(rawUrl: string): boolean {
            try {
              const url = new URL(rawUrl);
              return url.protocol === "https:" || url.protocol === "http:";
            } catch {
              return false;
            }
          }

          export async function persistSamAttachment(input: PersistSamAttachmentInput): Promise<PersistSamAttachmentResult> {
            if (!input.sourceUrl || !isAllowedSamAttachmentUrl(input.sourceUrl)) {
              return { downloaded: false, warning: "Attachment URL is missing or unsupported." };
            }

            try {
              const response = await fetch(input.sourceUrl, {
                redirect: "follow",
                signal: AbortSignal.timeout(FETCH_TIMEOUT_MS),
                headers: { Accept: "*/*" },
              });

              if (!response.ok) {
                return { downloaded: false, warning: `Attachment download returned HTTP ${response.status}.` };
              }

              const contentLength = Number(response.headers.get("content-length") || 0);
              if (contentLength > MAX_ATTACHMENT_BYTES) {
                return { downloaded: false, warning: "Attachment exceeds the 25 MB automatic-download limit." };
              }

              const contentType = (response.headers.get("content-type") || input.declaredType || "application/octet-stream")
                .split(";")[0]
                .trim()
                .toLowerCase();

              if (contentType && !ALLOWED_CONTENT_TYPES.has(contentType)) {
                return { downloaded: false, warning: `Attachment content type ${contentType} is not eligible for automatic storage.` };
              }

              const bytes = new Uint8Array(await response.arrayBuffer());
              if (bytes.byteLength > MAX_ATTACHMENT_BYTES) {
                return { downloaded: false, warning: "Attachment exceeds the 25 MB automatic-download limit." };
              }

              const relKey = `workspaces/${input.workspaceId}/opportunities/${input.opportunityId}/sam/${safeFileName(input.fileName)}`;
              const stored = await storagePut(relKey, bytes, contentType || "application/octet-stream");

              return {
                downloaded: true,
                storagePath: stored.key,
                contentType,
                sizeBytes: bytes.byteLength,
              };
            } catch (error: any) {
              return { downloaded: false, warning: `Attachment could not be stored automatically: ${error?.message || "unknown error"}` };
            }
          }
          EOF

          python - <<'PY'
          from pathlib import Path
          p = Path('server/samRouter.ts')
          s = p.read_text()
          old = 'import { TRPCError } from "@trpc/server";\n'
          new = old + 'import { persistSamAttachment } from "./services/samAttachmentStorage";\n'
          if old not in s:
              raise SystemExit('TRPC import marker missing')
          s = s.replace(old, new, 1)

          # URL import: store DB row first, then attempt controlled persistence and update the exact workspace-scoped row.
          old_block = '''            await db.insert(opportunitySourceFiles).values({
              workspaceId: wsId,
              opportunityId,
              fileName: att.name || "Unnamed Attachment",
              fileUrl: att.url || null,
              fileType: att.type || null,
              sourceSystem: "sam.gov",
              sourceCategory: categorizeAttachment(att.name, att.type),
              isDownloaded: false,
              isSourceDocument: att.type === "related_notice" || att.name?.toLowerCase().includes("solicitation"),
            });
            savedCount++;'''
          new_block = '''            const sourceFileResult = await db.insert(opportunitySourceFiles).values({
              workspaceId: wsId,
              opportunityId,
              fileName: att.name || "Unnamed Attachment",
              fileUrl: att.url || null,
              fileType: att.type || null,
              sourceSystem: "sam.gov",
              sourceCategory: categorizeAttachment(att.name, att.type),
              isDownloaded: false,
              isSourceDocument: att.type === "related_notice" || att.name?.toLowerCase().includes("solicitation"),
            });
            const sourceFileId = resolveInsertId(sourceFileResult);
            if (sourceFileId && att.url && att.type !== "related_notice") {
              const persisted = await persistSamAttachment({
                workspaceId: wsId,
                opportunityId,
                fileName: att.name || "Unnamed Attachment",
                sourceUrl: att.url,
                declaredType: att.type || null,
              });
              if (persisted.downloaded && persisted.storagePath) {
                await db.update(opportunitySourceFiles).set({
                  isDownloaded: true,
                  downloadedFilePath: persisted.storagePath,
                  fileType: persisted.contentType || att.type || null,
                }).where(and(
                  eq(opportunitySourceFiles.id, sourceFileId),
                  eq(opportunitySourceFiles.workspaceId, wsId),
                  eq(opportunitySourceFiles.opportunityId, opportunityId),
                ));
              }
            }
            savedCount++;'''
          if old_block not in s:
              raise SystemExit('initial attachment block missing')
          s = s.replace(old_block, new_block, 1)

          # Resync: same controlled persistence for newly discovered attachments.
          old_block2 = '''            await db.insert(opportunitySourceFiles).values({
              workspaceId: wsId,
              opportunityId: input.opportunityId,
              fileName: att.name || "Unnamed Attachment",
              fileUrl: att.url || null,
              fileType: att.type || null,
              sourceSystem: "sam.gov",
              sourceCategory: categorizeAttachment(att.name, att.type),
              isDownloaded: false,
              isSourceDocument: false,
            });'''
          new_block2 = '''            const sourceFileResult = await db.insert(opportunitySourceFiles).values({
              workspaceId: wsId,
              opportunityId: input.opportunityId,
              fileName: att.name || "Unnamed Attachment",
              fileUrl: att.url || null,
              fileType: att.type || null,
              sourceSystem: "sam.gov",
              sourceCategory: categorizeAttachment(att.name, att.type),
              isDownloaded: false,
              isSourceDocument: false,
            });
            const sourceFileId = resolveInsertId(sourceFileResult);
            if (sourceFileId && att.url && att.type !== "related_notice") {
              const persisted = await persistSamAttachment({
                workspaceId: wsId,
                opportunityId: input.opportunityId,
                fileName: att.name || "Unnamed Attachment",
                sourceUrl: att.url,
                declaredType: att.type || null,
              });
              if (persisted.downloaded && persisted.storagePath) {
                await db.update(opportunitySourceFiles).set({
                  isDownloaded: true,
                  downloadedFilePath: persisted.storagePath,
                  fileType: persisted.contentType || att.type || null,
                }).where(and(
                  eq(opportunitySourceFiles.id, sourceFileId),
                  eq(opportunitySourceFiles.workspaceId, wsId),
                  eq(opportunitySourceFiles.opportunityId, input.opportunityId),
                ));
              }
            }'''
          if old_block2 not in s:
              raise SystemExit('resync attachment block missing')
          s = s.replace(old_block2, new_block2, 1)
          p.write_text(s)
          PY

          cat > server/phase4SamAttachments.test.ts <<'EOF'
          import { describe, expect, it } from "vitest";
          import fs from "node:fs";
          import path from "node:path";
          import { isAllowedSamAttachmentUrl } from "./services/samAttachmentStorage";

          describe("Phase 4 SAM attachment persistence", () => {
            const router = fs.readFileSync(path.join(process.cwd(), "server/samRouter.ts"), "utf8");
            const service = fs.readFileSync(path.join(process.cwd(), "server/services/samAttachmentStorage.ts"), "utf8");

            it("only accepts http(s) source URLs", () => {
              expect(isAllowedSamAttachmentUrl("https://sam.gov/file.pdf")).toBe(true);
              expect(isAllowedSamAttachmentUrl("http://example.com/file.pdf")).toBe(true);
              expect(isAllowedSamAttachmentUrl("file:///etc/passwd")).toBe(false);
              expect(isAllowedSamAttachmentUrl("javascript:alert(1)")).toBe(false);
            });

            it("enforces download limits and storage namespaces", () => {
              expect(service).toContain("25 * 1024 * 1024");
              expect(service).toContain("workspaces/${input.workspaceId}/opportunities/${input.opportunityId}/sam/");
              expect(service).toContain("ALLOWED_CONTENT_TYPES");
            });

            it("persists initial and resynced attachments through controlled storage", () => {
              expect((router.match(/persistSamAttachment\(/g) || []).length).toBeGreaterThanOrEqual(2);
              expect(router).toContain("downloadedFilePath: persisted.storagePath");
              expect(router).toContain("eq(opportunitySourceFiles.workspaceId, wsId)");
            });
          });
          EOF

      - name: Verify source assertions
        run: |
          grep -q 'persistSamAttachment' server/samRouter.ts
          grep -q 'MAX_ATTACHMENT_BYTES' server/services/samAttachmentStorage.ts
          grep -q 'downloadedFilePath: persisted.storagePath' server/samRouter.ts

      - run: corepack enable && corepack prepare pnpm@10.4.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm drizzle-kit migrate
      - run: pnpm check
      - run: env -u RESEND_API_KEY pnpm test
      - run: pnpm build

      - name: Commit verified attachment persistence without temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase4-sam-attachments.yml
          git add server/samRouter.ts server/services/samAttachmentStorage.ts server/phase4SamAttachments.test.ts
          git commit -m "feat(phase4): persist SAM source attachments safely"
          git push origin HEAD:agent/phase4-opportunity-intake
