name: Phase 4 SAM attachment persistence v2

on:
  push:
    branches: [agent/phase4-opportunity-intake]
    paths: [.github/workflows/phase4-sam-attachments.yml]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: primecontractoros_test
          MYSQL_USER: user
          MYSQL_PASSWORD: pass
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uuser -ppass"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: mysql://user:pass@127.0.0.1:3306/primecontractoros_test
      JWT_SECRET: phase4-validation-only
      VITE_APP_ID: phase4-validation
      OAUTH_SERVER_URL: https://example.invalid
      VITE_OAUTH_PORTAL_URL: https://example.invalid
      OWNER_OPEN_ID: phase4-owner
      OWNER_NAME: Phase4 Owner
      OPENAI_API_KEY: sk-test-dummy
      SAM_GOV_API_KEY: phase4-test
      STRIPE_SECRET_KEY: sk_test_phase4
      STRIPE_PUBLISHABLE_KEY: pk_test_phase4
      STRIPE_WEBHOOK_SECRET: whsec_phase4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase4-opportunity-intake
          fetch-depth: 0

      - name: Add secure controlled SAM attachment persistence
        run: |
          cat > server/services/samAttachmentStorage.ts <<'EOF'
          import { lookup } from "node:dns/promises";
          import { isIP } from "node:net";
          import { storagePut } from "../storage";

          const MAX_ATTACHMENT_BYTES = 25 * 1024 * 1024;
          const FETCH_TIMEOUT_MS = 20_000;
          const MAX_REDIRECTS = 5;

          const ALLOWED_CONTENT_TYPES = new Set([
            "application/pdf",
            "application/zip",
            "application/x-zip-compressed",
            "application/msword",
            "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
            "application/vnd.ms-excel",
            "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
            "text/plain",
            "text/csv",
            "application/octet-stream",
          ]);

          export interface PersistSamAttachmentInput {
            workspaceId: number;
            opportunityId: number;
            fileName: string;
            sourceUrl: string;
            declaredType?: string | null;
          }

          export interface PersistSamAttachmentResult {
            downloaded: boolean;
            storagePath?: string;
            contentType?: string;
            sizeBytes?: number;
            warning?: string;
          }

          function safeFileName(name: string): string {
            return (name || "attachment")
              .replace(/[^a-zA-Z0-9._-]+/g, "_")
              .replace(/^_+|_+$/g, "")
              .slice(0, 180) || "attachment";
          }

          export function isPrivateAddress(address: string): boolean {
            const version = isIP(address);
            if (version === 4) {
              const parts = address.split(".").map(Number);
              if (parts.length !== 4 || parts.some(n => !Number.isInteger(n) || n < 0 || n > 255)) return true;
              const [a, b] = parts;
              return a === 0 || a === 10 || a === 127 ||
                (a === 100 && b >= 64 && b <= 127) ||
                (a === 169 && b === 254) ||
                (a === 172 && b >= 16 && b <= 31) ||
                (a === 192 && b === 0) ||
                (a === 192 && b === 168) ||
                (a === 198 && (b === 18 || b === 19)) ||
                (a === 192 && b === 0 && parts[2] === 2) ||
                (a === 198 && b === 51 && parts[2] === 100) ||
                (a === 203 && b === 0 && parts[2] === 113) ||
                a >= 224;
            }
            if (version === 6) {
              const lower = address.toLowerCase();
              if (lower === "::" || lower === "::1") return true;
              if (lower.startsWith("fc") || lower.startsWith("fd") || lower.startsWith("fe8") || lower.startsWith("fe9") || lower.startsWith("fea") || lower.startsWith("feb") || lower.startsWith("ff")) return true;
              const mapped = lower.match(/^::ffff:(\d+\.\d+\.\d+\.\d+)$/);
              if (mapped) return isPrivateAddress(mapped[1]);
              return false;
            }
            return true;
          }

          export function isAllowedSamAttachmentUrl(rawUrl: string): boolean {
            try {
              const url = new URL(rawUrl);
              return url.protocol === "https:" && !url.username && !url.password;
            } catch {
              return false;
            }
          }

          async function validatePublicHttpsUrl(rawUrl: string): Promise<URL> {
            if (!isAllowedSamAttachmentUrl(rawUrl)) throw new Error("Attachment URL must be credential-free HTTPS.");
            const url = new URL(rawUrl);
            const host = url.hostname.toLowerCase();
            if (host === "localhost" || host.endsWith(".localhost")) throw new Error("Local attachment hosts are not allowed.");
            if (isIP(host) && isPrivateAddress(host)) throw new Error("Private attachment hosts are not allowed.");
            const addresses = await lookup(host, { all: true, verbatim: true });
            if (!addresses.length || addresses.some(({ address }) => isPrivateAddress(address))) {
              throw new Error("Attachment host resolves to a non-public address.");
            }
            return url;
          }

          async function fetchValidated(rawUrl: string, redirects = 0): Promise<Response> {
            const target = await validatePublicHttpsUrl(rawUrl);
            const response = await fetch(target, {
              redirect: "manual",
              signal: AbortSignal.timeout(FETCH_TIMEOUT_MS),
              headers: { Accept: "*/*" },
            });
            if ([301, 302, 303, 307, 308].includes(response.status)) {
              if (redirects >= MAX_REDIRECTS) throw new Error("Attachment exceeded redirect limit.");
              const location = response.headers.get("location");
              if (!location) throw new Error("Attachment redirect did not include a location.");
              return fetchValidated(new URL(location, target).toString(), redirects + 1);
            }
            return response;
          }

          export async function persistSamAttachment(input: PersistSamAttachmentInput): Promise<PersistSamAttachmentResult> {
            try {
              const response = await fetchValidated(input.sourceUrl);
              if (!response.ok) return { downloaded: false, warning: `Attachment download returned HTTP ${response.status}.` };

              const contentLength = Number(response.headers.get("content-length") || 0);
              if (contentLength > MAX_ATTACHMENT_BYTES) {
                return { downloaded: false, warning: "Attachment exceeds the 25 MB automatic-download limit." };
              }

              const contentType = (response.headers.get("content-type") || input.declaredType || "application/octet-stream")
                .split(";")[0]
                .trim()
                .toLowerCase();
              if (!ALLOWED_CONTENT_TYPES.has(contentType)) {
                return { downloaded: false, warning: `Attachment content type ${contentType} is not eligible for automatic storage.` };
              }

              const bytes = new Uint8Array(await response.arrayBuffer());
              if (bytes.byteLength > MAX_ATTACHMENT_BYTES) {
                return { downloaded: false, warning: "Attachment exceeds the 25 MB automatic-download limit." };
              }

              const relKey = `workspaces/${input.workspaceId}/opportunities/${input.opportunityId}/sam/${safeFileName(input.fileName)}`;
              const stored = await storagePut(relKey, bytes, contentType);
              return { downloaded: true, storagePath: stored.key, contentType, sizeBytes: bytes.byteLength };
            } catch (error: any) {
              return { downloaded: false, warning: `Attachment could not be stored automatically: ${error?.message || "unknown error"}` };
            }
          }
          EOF

          python - <<'PY'
          from pathlib import Path
          p = Path('server/samRouter.ts')
          s = p.read_text()
          trpc = 'import { TRPCError } from "@trpc/server";\n'
          persist_import = 'import { persistSamAttachment } from "./services/samAttachmentStorage";\n'
          if persist_import not in s:
              if trpc not in s:
                  raise SystemExit('TRPC import marker missing')
              s = s.replace(trpc, trpc + persist_import, 1)

          start = s.index('      // 7. Save attachments as source files')
          end = s.index('      // 8. Log successful import', start)
          initial = '''      // 7. Save attachments as source files and persist eligible source documents
          let attachmentWarning: string | null = null;
          if (fetchResult.attachments && fetchResult.attachments.length > 0) {
            let savedCount = 0;
            let downloadWarnings = 0;
            for (const att of fetchResult.attachments) {
              try {
                const sourceFileResult = await db.insert(opportunitySourceFiles).values({
                  workspaceId: wsId,
                  opportunityId,
                  fileName: att.name || "Unnamed Attachment",
                  fileUrl: att.url || null,
                  fileType: att.type || null,
                  sourceSystem: "sam.gov",
                  sourceCategory: categorizeAttachment(att.name, att.type),
                  isDownloaded: false,
                  isSourceDocument: att.type === "related_notice" || att.name?.toLowerCase().includes("solicitation"),
                });
                const sourceFileId = resolveInsertId(sourceFileResult);
                if (sourceFileId && att.url && att.type !== "related_notice") {
                  const persisted = await persistSamAttachment({
                    workspaceId: wsId,
                    opportunityId,
                    fileName: att.name || "Unnamed Attachment",
                    sourceUrl: att.url,
                    declaredType: att.type || null,
                  });
                  if (persisted.downloaded && persisted.storagePath) {
                    await db.update(opportunitySourceFiles).set({
                      isDownloaded: true,
                      downloadedFilePath: persisted.storagePath,
                      fileType: persisted.contentType || att.type || null,
                    }).where(and(
                      eq(opportunitySourceFiles.id, sourceFileId),
                      eq(opportunitySourceFiles.workspaceId, wsId),
                      eq(opportunitySourceFiles.opportunityId, opportunityId),
                    ));
                  } else if (persisted.warning) {
                    downloadWarnings++;
                    console.warn("[SAM Import] Attachment retained as source link:", att.name, persisted.warning);
                  }
                }
                savedCount++;
              } catch (err) {
                console.warn("[SAM Import] Failed to save attachment:", att.name, err);
              }
            }
            if (savedCount < fetchResult.attachments.length) {
              attachmentWarning = `Opportunity imported, but ${fetchResult.attachments.length - savedCount} of ${fetchResult.attachments.length} source attachments could not be saved. Available links were preserved for review.`;
            } else if (downloadWarnings > 0) {
              attachmentWarning = `Opportunity imported with all source links preserved; ${downloadWarnings} attachment(s) were not eligible for automatic local storage.`;
            }
          }

          '''
          s = s[:start] + initial + s[end:]

          start2 = s.index('      // Save new attachments if any')
          end2 = s.index('      // Log sync', start2)
          resync = '''      // Save and persist newly discovered attachments
          if (fetchResult.attachments && fetchResult.attachments.length > 0) {
            for (const att of fetchResult.attachments) {
              const [existingFile] = await db
                .select()
                .from(opportunitySourceFiles)
                .where(and(
                  eq(opportunitySourceFiles.workspaceId, wsId),
                  eq(opportunitySourceFiles.opportunityId, input.opportunityId),
                  eq(opportunitySourceFiles.fileName, att.name || "Unnamed")
                ))
                .limit(1);

              if (!existingFile) {
                const sourceFileResult = await db.insert(opportunitySourceFiles).values({
                  workspaceId: wsId,
                  opportunityId: input.opportunityId,
                  fileName: att.name || "Unnamed Attachment",
                  fileUrl: att.url || null,
                  fileType: att.type || null,
                  sourceSystem: "sam.gov",
                  sourceCategory: categorizeAttachment(att.name, att.type),
                  isDownloaded: false,
                  isSourceDocument: att.type === "related_notice" || att.name?.toLowerCase().includes("solicitation"),
                });
                const sourceFileId = resolveInsertId(sourceFileResult);
                if (sourceFileId && att.url && att.type !== "related_notice") {
                  const persisted = await persistSamAttachment({
                    workspaceId: wsId,
                    opportunityId: input.opportunityId,
                    fileName: att.name || "Unnamed Attachment",
                    sourceUrl: att.url,
                    declaredType: att.type || null,
                  });
                  if (persisted.downloaded && persisted.storagePath) {
                    await db.update(opportunitySourceFiles).set({
                      isDownloaded: true,
                      downloadedFilePath: persisted.storagePath,
                      fileType: persisted.contentType || att.type || null,
                    }).where(and(
                      eq(opportunitySourceFiles.id, sourceFileId),
                      eq(opportunitySourceFiles.workspaceId, wsId),
                      eq(opportunitySourceFiles.opportunityId, input.opportunityId),
                    ));
                  } else if (persisted.warning) {
                    console.warn("[SAM Resync] Attachment retained as source link:", att.name, persisted.warning);
                  }
                }
              }
            }
          }

          '''
          s = s[:start2] + resync + s[end2:]
          p.write_text(s)
          PY

          cat > server/phase4SamAttachments.test.ts <<'EOF'
          import { describe, expect, it } from "vitest";
          import fs from "node:fs";
          import path from "node:path";
          import { isAllowedSamAttachmentUrl, isPrivateAddress } from "./services/samAttachmentStorage";

          describe("Phase 4 SAM attachment persistence", () => {
            const router = fs.readFileSync(path.join(process.cwd(), "server/samRouter.ts"), "utf8");
            const service = fs.readFileSync(path.join(process.cwd(), "server/services/samAttachmentStorage.ts"), "utf8");

            it("requires credential-free HTTPS URLs", () => {
              expect(isAllowedSamAttachmentUrl("https://sam.gov/file.pdf")).toBe(true);
              expect(isAllowedSamAttachmentUrl("http://sam.gov/file.pdf")).toBe(false);
              expect(isAllowedSamAttachmentUrl("https://user:pass@sam.gov/file.pdf")).toBe(false);
              expect(isAllowedSamAttachmentUrl("file:///etc/passwd")).toBe(false);
              expect(isAllowedSamAttachmentUrl("javascript:alert(1)")).toBe(false);
            });

            it("rejects private and reserved addresses", () => {
              for (const ip of ["127.0.0.1", "10.1.2.3", "169.254.1.1", "172.16.0.1", "192.168.1.1", "100.64.0.1", "::1", "fc00::1", "fe80::1"]) {
                expect(isPrivateAddress(ip)).toBe(true);
              }
              expect(isPrivateAddress("8.8.8.8")).toBe(false);
            });

            it("uses manual validated redirects, download caps, and scoped storage", () => {
              expect(service).toContain('redirect: "manual"');
              expect(service).toContain("MAX_REDIRECTS = 5");
              expect(service).toContain("25 * 1024 * 1024");
              expect(service).toContain("lookup(host, { all: true, verbatim: true })");
              expect(service).toContain("workspaces/${input.workspaceId}/opportunities/${input.opportunityId}/sam/");
            });

            it("persists initial and resynced attachments without losing source links", () => {
              expect((router.match(/persistSamAttachment\(/g) || []).length).toBeGreaterThanOrEqual(2);
              expect(router).toContain("downloadedFilePath: persisted.storagePath");
              expect(router).toContain("Attachment retained as source link");
              expect(router).toContain("eq(opportunitySourceFiles.workspaceId, wsId)");
            });
          });
          EOF

      - name: Verify security and source assertions
        run: |
          grep -q 'persistSamAttachment' server/samRouter.ts
          grep -q 'MAX_ATTACHMENT_BYTES' server/services/samAttachmentStorage.ts
          grep -q 'redirect: "manual"' server/services/samAttachmentStorage.ts
          ! grep -q 'redirect: "follow"' server/services/samAttachmentStorage.ts
          grep -q 'downloadedFilePath: persisted.storagePath' server/samRouter.ts

      - run: corepack enable && corepack prepare pnpm@10.4.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm drizzle-kit migrate
      - run: pnpm check
      - run: env -u RESEND_API_KEY pnpm test
      - run: pnpm build

      - name: Commit verified attachment persistence without temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase4-sam-attachments.yml
          git add server/samRouter.ts server/services/samAttachmentStorage.ts server/phase4SamAttachments.test.ts
          git commit -m "feat(phase4): persist SAM source attachments safely"
          git push origin HEAD:agent/phase4-opportunity-intake
