name: Phase 1 system infrastructure tenancy hardening

on:
  push:
    branches:
      - agent/v2-modernization-phase1
    paths:
      - .github/workflows/phase1-system-infra-tenancy-hardening.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: primecontractoros_test
          MYSQL_USER: user
          MYSQL_PASSWORD: pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uuser -ppass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql://user:pass@127.0.0.1:3306/primecontractoros_test
      JWT_SECRET: phase1-validation-only-not-a-secret
      VITE_APP_ID: phase1-validation
      OAUTH_SERVER_URL: https://example.invalid
      VITE_OAUTH_PORTAL_URL: https://example.invalid
      OWNER_OPEN_ID: phase1-owner
      OWNER_NAME: Phase1 Owner
      OPENAI_API_KEY: sk-test-dummy-phase1-validation
      SAM_GOV_API_KEY: phase1-test
      STRIPE_SECRET_KEY: sk_test_phase1_validation
      STRIPE_PUBLISHABLE_KEY: pk_test_phase1_validation
      STRIPE_WEBHOOK_SECRET: whsec_phase1_validation
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v2-modernization-phase1
          fetch-depth: 0

      - name: Enforce active workspace across system infrastructure routes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('server/systemInfraRouter.ts')
          s=p.read_text()

          s=s.replace('import { router, protectedProcedure } from "./_core/trpc";','import { router, protectedProcedure } from "./_core/trpc";\nimport { TRPCError } from "@trpc/server";\nimport { requireWorkspaceId } from "./workspaceMiddleware";',1)
          anchor='''export async function createNotification(params: {
            workspaceId: number;
            userId?: number;
            category: string;
            title: string;
            message?: string;
            relatedType?: string;
            relatedId?: number;
            priority?: "low" | "medium" | "high" | "urgent";
          }) {
            const db = await getDb();
            if (!db) return;
            await db.insert(notifications).values(params);
          }
          '''
          helper='''
          async function requireActiveWorkspace(ctx: any, requestedWorkspaceId?: number): Promise<number> {
            if (!ctx.user?.id) throw new TRPCError({ code: "UNAUTHORIZED" });
            const workspaceId = await requireWorkspaceId(ctx.user.id);
            if (requestedWorkspaceId !== undefined && requestedWorkspaceId !== workspaceId) {
              throw new TRPCError({ code: "FORBIDDEN", message: "Workspace access denied" });
            }
            return workspaceId;
          }

          async function requireSupportTicketInWorkspace(ticketId: number, workspaceId: number) {
            const db = await getDb();
            if (!db) throw new Error("Database not available");
            const [ticket] = await db.select().from(supportTickets)
              .where(and(eq(supportTickets.id, ticketId), eq(supportTickets.workspaceId, workspaceId)))
              .limit(1);
            if (!ticket) throw new TRPCError({ code: "NOT_FOUND", message: "Support ticket not found" });
            return ticket;
          }
          '''
          if anchor not in s: raise SystemExit('notification helper anchor missing')
          s=s.replace(anchor,anchor+helper,1)

          # All caller-supplied workspace IDs in tenant routes must equal the user's active workspace.
          targets=[
            ('.query(async ({ input }) => {\n        const db = await getDb();\n        if (!db) return { logs: [], total: 0 };\n        const conditions = [eq(auditLogs.workspaceId, input.workspaceId)];', '.query(async ({ ctx, input }) => {\n        const db = await getDb();\n        if (!db) return { logs: [], total: 0 };\n        const wsId = await requireActiveWorkspace(ctx, input.workspaceId);\n        const conditions = [eq(auditLogs.workspaceId, wsId)];'),
            ('.query(async ({ input }) => {\n        const db = await getDb();\n        if (!db) return { notifications: [], unreadCount: 0 };\n        const conditions: any[] = [eq(notifications.workspaceId, input.workspaceId)];', '.query(async ({ ctx, input }) => {\n        const db = await getDb();\n        if (!db) return { notifications: [], unreadCount: 0 };\n        const wsId = await requireActiveWorkspace(ctx, input.workspaceId);\n        const conditions: any[] = [eq(notifications.workspaceId, wsId)];'),
            ('.query(async ({ input }) => {\n        const db = await getDb();\n        if (!db) return { results: [] };\n        const searchTerm = `%${input.term}%`;', '.query(async ({ ctx, input }) => {\n        const db = await getDb();\n        if (!db) return { results: [] };\n        const wsId = await requireActiveWorkspace(ctx, input.workspaceId);\n        const searchTerm = `%${input.term}%`;'),
            ('.query(async ({ input }) => {\n        const db = await getDb();\n        if (!db) return { score: 0, factors: [] };', '.query(async ({ ctx, input }) => {\n        const db = await getDb();\n        if (!db) return { score: 0, factors: [] };\n        const wsId = await requireActiveWorkspace(ctx, input.workspaceId);'),
            ('.query(async ({ input }) => {\n        const db = await getDb();\n        if (!db) return { contracts: [], averageScore: 0 };', '.query(async ({ ctx, input }) => {\n        const db = await getDb();\n        if (!db) return { contracts: [], averageScore: 0 };\n        const wsId = await requireActiveWorkspace(ctx, input.workspaceId);'),
            ('.mutation(async ({ ctx, input }) => {\n        const db = await getDb();\n        if (!db) return { success: false };\n\n        const tableMap: Record<string, any> = {', '.mutation(async ({ ctx, input }) => {\n        const db = await getDb();\n        if (!db) return { success: false };\n        const wsId = await requireActiveWorkspace(ctx, input.workspaceId);\n\n        const tableMap: Record<string, any> = {'),
            ('.mutation(async ({ ctx, input }) => {\n        const db = await getDb();\n        if (!db) return { success: false, data: "" };\n        const tableMap: Record<string, any> = {', '.mutation(async ({ ctx, input }) => {\n        const db = await getDb();\n        if (!db) return { success: false, data: "" };\n        const wsId = await requireActiveWorkspace(ctx, input.workspaceId);\n        const tableMap: Record<string, any> = {'),
            ('.mutation(async ({ ctx, input }) => {\n        const db = await getDb();\n        if (!db) return { success: false, imported: 0 };\n        const lines = input.csvContent.trim().split("\\n");', '.mutation(async ({ ctx, input }) => {\n        const db = await getDb();\n        if (!db) return { success: false, imported: 0 };\n        const wsId = await requireActiveWorkspace(ctx, input.workspaceId);\n        const lines = input.csvContent.trim().split("\\n");'),
            ('.query(async ({ input }) => {\n        return {\n          enabled: true,', '.query(async ({ ctx, input }) => {\n        await requireActiveWorkspace(ctx, input.workspaceId);\n        return {\n          enabled: true,'),
            ('.mutation(async ({ ctx, input }) => {\n        await logAuditEvent({\n          workspaceId: input.workspaceId,', '.mutation(async ({ ctx, input }) => {\n        const wsId = await requireActiveWorkspace(ctx, input.workspaceId);\n        await logAuditEvent({\n          workspaceId: wsId,'),
            ('.query(async ({ input }) => {\n        const db = await getDb();\n        if (!db) return { score: 0, total: 8, completed: 0, items: [] };', '.query(async ({ ctx, input }) => {\n        const db = await getDb();\n        if (!db) return { score: 0, total: 8, completed: 0, items: [] };\n        const wsId = await requireActiveWorkspace(ctx, input.workspaceId);'),
          ]
          for old,new in targets:
            if old not in s: raise SystemExit('target missing: '+old[:80])
            s=s.replace(old,new,1)

          # Replace workspace references inside routes after the active workspace is resolved.
          # This is safe because helper definitions are above these route bodies and are not affected.
          sections = [
            ('auditLogs: router({','  // ============================================================\n  // Notifications'),
            ('notifications: router({','  // ============================================================\n  // Global Search'),
            ('search: router({','  // ============================================================\n  // Contract Health Score'),
            ('health: router({','  // ============================================================\n  // Archive / Soft Delete'),
            ('archive: router({','  // ============================================================\n  // System Errors'),
            ('exports: router({','  // ============================================================\n  // Import System'),
            ('imports: router({','  // ============================================================\n  // AI Cost and Usage Controls'),
            ('aiControls: router({','  // ============================================================\n  // Workspace Setup Completeness Score'),
            ('workspaceCompleteness: router({','  // ============================================================\n  // Support System'),
          ]
          for start,end in sections:
            a=s.index(start); b=s.index(end,a)
            seg=s[a:b].replace('input.workspaceId','wsId')
            s=s[:a]+seg+s[b:]

          # Notification mutations must be scoped to the user's workspace even though input has no workspaceId.
          s=s.replace('''    markRead: protectedProcedure
            .input(z.object({ notificationId: z.number() }))
            .mutation(async ({ input }) => {
              const db = await getDb();
              if (!db) return { success: false };
              await db.update(notifications).set({ isRead: true }).where(eq(notifications.id, input.notificationId));
              return { success: true };
            }),''','''    markRead: protectedProcedure
            .input(z.object({ notificationId: z.number() }))
            .mutation(async ({ ctx, input }) => {
              const db = await getDb();
              if (!db) return { success: false };
              const wsId = await requireActiveWorkspace(ctx);
              await db.update(notifications).set({ isRead: true })
                .where(and(eq(notifications.id, input.notificationId), eq(notifications.workspaceId, wsId)));
              return { success: true };
            }),''',1)
          s=s.replace('''    dismiss: protectedProcedure
            .input(z.object({ notificationId: z.number() }))
            .mutation(async ({ input }) => {
              const db = await getDb();
              if (!db) return { success: false };
              await db.update(notifications).set({ dismissedAt: new Date() }).where(eq(notifications.id, input.notificationId));
              return { success: true };
            }),''','''    dismiss: protectedProcedure
            .input(z.object({ notificationId: z.number() }))
            .mutation(async ({ ctx, input }) => {
              const db = await getDb();
              if (!db) return { success: false };
              const wsId = await requireActiveWorkspace(ctx);
              await db.update(notifications).set({ dismissedAt: new Date() })
                .where(and(eq(notifications.id, input.notificationId), eq(notifications.workspaceId, wsId)));
              return { success: true };
            }),''',1)
          # markAllRead still has a requested workspace ID: assert it and use the resolved value.
          s=s.replace('''    markAllRead: protectedProcedure
            .input(z.object({ workspaceId: z.number() }))
            .mutation(async ({ input }) => {
              const db = await getDb();
              if (!db) return { success: false };
              await db.update(notifications).set({ isRead: true }).where(eq(notifications.workspaceId, input.workspaceId));
              return { success: true };
            }),''','''    markAllRead: protectedProcedure
            .input(z.object({ workspaceId: z.number() }))
            .mutation(async ({ ctx, input }) => {
              const db = await getDb();
              if (!db) return { success: false };
              const wsId = await requireActiveWorkspace(ctx, input.workspaceId);
              await db.update(notifications).set({ isRead: true }).where(eq(notifications.workspaceId, wsId));
              return { success: true };
            }),''',1)

          # Support list/create/update/note must never escape the active workspace.
          old='''    list: protectedProcedure
            .input(z.object({ workspaceId: z.number().optional(), status: z.string().optional() }).optional())
            .query(async ({ ctx, input }) => {
              const db = await getDb();
              if (!db) return [];
              const conditions: any[] = [];
              if (input?.workspaceId) conditions.push(eq(supportTickets.workspaceId, input.workspaceId));
              if (input?.status) conditions.push(eq(supportTickets.status, input.status as any));'''
          new='''    list: protectedProcedure
            .input(z.object({ workspaceId: z.number().optional(), status: z.string().optional() }).optional())
            .query(async ({ ctx, input }) => {
              const db = await getDb();
              if (!db) return [];
              const wsId = await requireActiveWorkspace(ctx, input?.workspaceId);
              const conditions: any[] = [eq(supportTickets.workspaceId, wsId)];
              if (input?.status) conditions.push(eq(supportTickets.status, input.status as any));'''
          if old not in s: raise SystemExit('support list target missing')
          s=s.replace(old,new,1)
          old='''      .mutation(async ({ ctx, input }) => {
              const db = await getDb();
              if (!db) return { success: false };
              await db.insert(supportTickets).values({
                ...input,
                userId: ctx.user.id,
              });
              await logAuditEvent({
                workspaceId: input.workspaceId,'''
          new='''      .mutation(async ({ ctx, input }) => {
              const db = await getDb();
              if (!db) return { success: false };
              const wsId = await requireActiveWorkspace(ctx, input.workspaceId);
              await db.insert(supportTickets).values({
                ...input,
                workspaceId: wsId,
                userId: ctx.user.id,
              });
              await logAuditEvent({
                workspaceId: wsId,'''
          if old not in s: raise SystemExit('support create target missing')
          s=s.replace(old,new,1)
          old='''      .mutation(async ({ ctx, input }) => {
              const db = await getDb();
              if (!db) return { success: false };
              const updateData: any = { status: input.status };'''
          new='''      .mutation(async ({ ctx, input }) => {
              const db = await getDb();
              if (!db) return { success: false };
              const wsId = await requireActiveWorkspace(ctx);
              await requireSupportTicketInWorkspace(input.id, wsId);
              const updateData: any = { status: input.status };'''
          # replace last matching support update, not earlier unrelated blocks
          idx=s.rfind(old)
          if idx<0: raise SystemExit('support update target missing')
          s=s[:idx]+s[idx:].replace(old,new,1)
          s=s.replace('await db.update(supportTickets).set(updateData).where(eq(supportTickets.id, input.id));','await db.update(supportTickets).set(updateData).where(and(eq(supportTickets.id, input.id), eq(supportTickets.workspaceId, wsId)));',1)
          old='''      .mutation(async ({ ctx, input }) => {
              await logAuditEvent({
                workspaceId: 0,
                userId: ctx.user.id,
                actionType: "note",
                targetType: "support_ticket",
                targetId: input.ticketId,'''
          new='''      .mutation(async ({ ctx, input }) => {
              const wsId = await requireActiveWorkspace(ctx);
              await requireSupportTicketInWorkspace(input.ticketId, wsId);
              await logAuditEvent({
                workspaceId: wsId,
                userId: ctx.user.id,
                actionType: "note",
                targetType: "support_ticket",
                targetId: input.ticketId,'''
          if old not in s: raise SystemExit('support note target missing')
          s=s.replace(old,new,1)

          # Assert critical invariants before writing.
          required=[
            'const workspaceId = await requireWorkspaceId(ctx.user.id);',
            'throw new TRPCError({ code: "FORBIDDEN", message: "Workspace access denied" });',
            'eq(notifications.workspaceId, wsId)',
            'await requireSupportTicketInWorkspace(input.id, wsId);',
            'const wsId = await requireActiveWorkspace(ctx, input?.workspaceId);',
          ]
          for x in required:
            if x not in s: raise SystemExit('missing invariant: '+x)
          p.write_text(s)
          PY

      - name: Add tenancy regression coverage
        run: |
          cat > server/systemInfraTenancy.test.ts <<'EOF'
          import { describe, expect, it } from "vitest";
          import { readFileSync } from "node:fs";
          import { fileURLToPath } from "node:url";
          import { dirname, join } from "node:path";
          const here = dirname(fileURLToPath(import.meta.url));
          const source = readFileSync(join(here, "systemInfraRouter.ts"), "utf8");

          describe("system infrastructure tenant isolation", () => {
            it("rejects caller-supplied workspace IDs outside the active workspace", () => {
              expect(source).toContain("requireWorkspaceId(ctx.user.id)");
              expect(source).toContain('code: "FORBIDDEN"');
              expect(source).toContain("Workspace access denied");
            });
            it("scopes notification mutations by workspace", () => {
              expect(source).toContain("and(eq(notifications.id, input.notificationId), eq(notifications.workspaceId, wsId))");
              expect(source).toContain("where(eq(notifications.workspaceId, wsId))");
            });
            it("forces support operations through the active workspace", () => {
              expect(source).toContain("requireSupportTicketInWorkspace(input.id, wsId)");
              expect(source).toContain("requireSupportTicketInWorkspace(input.ticketId, wsId)");
              expect(source).toContain("const conditions: any[] = [eq(supportTickets.workspaceId, wsId)]");
            });
            it("does not log support notes to workspace zero", () => {
              const support = source.slice(source.indexOf("support: router({"));
              expect(support).not.toContain("workspaceId: 0");
            });
          });
          EOF

      - run: corepack enable && corepack prepare pnpm@10.4.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm drizzle-kit migrate
      - run: pnpm check
      - run: env -u RESEND_API_KEY pnpm test
      - run: pnpm build
      - name: Commit verified hardening
        run: |
          rm -f .github/workflows/phase1-system-infra-tenancy-hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(security): enforce workspace isolation in system infrastructure'
          git push origin HEAD:agent/v2-modernization-phase1
