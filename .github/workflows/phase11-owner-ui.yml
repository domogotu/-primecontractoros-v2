name: Phase 11 owner UI boundary
on:
  push:
    branches: [agent/phase11-e2e-production-readiness]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: primecontractoros_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/primecontractoros_test
      JWT_SECRET: phase11-validation-secret-that-is-long-enough
      NODE_ENV: test
      OWNER_EMAIL: dominiquereed35@gmail.com
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Restrict platform owner UI to canonical email
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('client/src/pages/PlatformRouter.tsx')
          s=p.read_text()
          if 'isPlatformOwner' not in s:
              s=s.replace('import { Menu } from "lucide-react";', 'import { Menu } from "lucide-react";\nimport { isPlatformOwner } from "@/lib/platformOwner";')
          s=s.replace('if (user?.role !== "admin") {', 'if (!isPlatformOwner(user)) {')
          s=s.replace("You don't have admin permissions to access the platform management area.", "This area is reserved for the PrimeContractorOS platform owner.")
          p.write_text(s)

          p=Path('client/src/pages/PlatformLogin.tsx')
          s=p.read_text()
          if 'isPlatformOwner' not in s:
              s=s.replace('import { Redirect } from "wouter";', 'import { Redirect } from "wouter";\nimport { isPlatformOwner } from "@/lib/platformOwner";')
          s=s.replace(" * Platform admin access is determined by user role === 'admin'.\n * If already authenticated as admin, redirect to /platform.", " * Platform owner access is reserved for the canonical owner account.\n * If already authenticated as the platform owner, redirect to /platform.")
          s=s.replace('if (isAuthenticated && user?.role === "admin") {', 'if (isAuthenticated && isPlatformOwner(user)) {')
          s=s.replace('if (isAuthenticated && user?.role !== "admin") {', 'if (isAuthenticated && !isPlatformOwner(user)) {')
          s=s.replace('Your account does not have platform admin permissions.', 'This area is reserved for the PrimeContractorOS platform owner.')
          p.write_text(s)

          p=Path('client/src/components/AdminBadge.tsx')
          s=p.read_text()
          if 'isPlatformOwner' not in s:
              s=s.replace('import { Shield } from "lucide-react";', 'import { Shield } from "lucide-react";\nimport { isPlatformOwner } from "@/lib/platformOwner";')
          s=s.replace('if (!user || user.role !== "admin") return null;', 'if (!isPlatformOwner(user)) return null;')
          s=s.replace('<Shield className="h-3 w-3" /><span>Admin Mode</span>', '<Shield className="h-3 w-3" /><span>Platform Owner</span>')
          p.write_text(s)
          PY
      - name: Verify owner-only UI assertions
        run: |
          grep -q 'dominiquereed35@gmail.com' client/src/lib/platformOwner.ts
          grep -q 'isPlatformOwner(user)' client/src/pages/PlatformRouter.tsx
          grep -q 'isPlatformOwner(user)' client/src/pages/PlatformLogin.tsx
          grep -q 'isPlatformOwner(user)' client/src/components/AdminBadge.tsx
          ! grep -q 'user?.role !== "admin"' client/src/pages/PlatformRouter.tsx
      - run: corepack enable && corepack prepare pnpm@10.4.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm drizzle-kit migrate
      - run: pnpm check
      - run: env -u RESEND_API_KEY pnpm test
      - run: pnpm build
      - name: Commit verified owner UI boundary
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/src/lib/platformOwner.ts client/src/pages/PlatformRouter.tsx client/src/pages/PlatformLogin.tsx client/src/components/AdminBadge.tsx
          git commit -m 'feat(auth): enforce owner-only platform UI' || true
          git push
