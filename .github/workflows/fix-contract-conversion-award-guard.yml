name: One-time awarded proposal conversion guard

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require awarded proposal before contract conversion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('server/routers.ts')
          text = path.read_text()

          old = '''          const proposal = await getProposal(input.proposalId, wsId);\n          if (!proposal) throw new TRPCError({ code: "NOT_FOUND", message: "Proposal not found." });\n          const cf = input.carryForward || { contacts: true, files: true, notes: true, tasks: false, deliverables: true };\n'''

          new = '''          const proposal = await getProposal(input.proposalId, wsId);\n          if (!proposal) throw new TRPCError({ code: "NOT_FOUND", message: "Proposal not found." });\n          if (proposal.status !== "won") {\n            throw new TRPCError({\n              code: "PRECONDITION_FAILED",\n              message: "Only a proposal marked Won can be converted to an awarded contract. Confirm the award outcome before creating the contract record.",\n            });\n          }\n          const cf = input.carryForward || { contacts: true, files: true, notes: true, tasks: false, deliverables: true };\n'''

          if old not in text:
              raise SystemExit('Expected proposal conversion guard anchor was not found; refusing to modify the file.')

          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/routers.ts
          if git diff --cached --quiet; then
            echo 'No repair needed.'
          else
            git commit -m 'fix(contracts): require awarded proposal before conversion'
            git push origin HEAD:main
          fi
