name: Phase 9 production readiness

on:
  push:
    branches:
      - agent/phase9-production-readiness

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: primecontractoros_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/primecontractoros_test
      JWT_SECRET: phase9-validation-secret
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - name: Verify production readiness assertions
        run: |
          grep -q 'app.get("/api/health"' server/_core/index.ts
          grep -q 'server.listen(port, "0.0.0.0"' server/_core/index.ts
          grep -q 'isProduction ? preferredPort' server/_core/index.ts
          grep -q 'pnpm install --frozen-lockfile --prod=false' render.yaml
          grep -q 'startCommand: pnpm drizzle-kit migrate && node dist/index.js' render.yaml
          grep -q 'healthCheckPath: /api/health' render.yaml
      - run: corepack enable && corepack prepare pnpm@10.4.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm drizzle-kit migrate
      - run: pnpm check
      - run: env -u RESEND_API_KEY pnpm test
      - run: pnpm build
