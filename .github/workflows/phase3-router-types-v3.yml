name: Phase 3 router type hardening v3

on:
  push:
    branches:
      - agent/v2-modernization-phase3
    paths:
      - .github/workflows/phase3-router-types-v3.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: primecontractoros_test
          MYSQL_USER: user
          MYSQL_PASSWORD: pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uuser -ppass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql://user:pass@127.0.0.1:3306/primecontractoros_test
      JWT_SECRET: phase3-validation-only-not-a-secret
      VITE_APP_ID: phase3-validation
      OAUTH_SERVER_URL: https://example.invalid
      VITE_OAUTH_PORTAL_URL: https://example.invalid
      OWNER_OPEN_ID: phase3-owner
      OWNER_NAME: Phase3 Owner
      OPENAI_API_KEY: sk-test-dummy-phase3-validation
      SAM_GOV_API_KEY: phase3-test
      STRIPE_SECRET_KEY: sk_test_phase3_validation
      STRIPE_PUBLISHABLE_KEY: pk_test_phase3_validation
      STRIPE_WEBHOOK_SECRET: whsec_phase3-validation
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v2-modernization-phase3
          fetch-depth: 0

      - name: Repair central router schema mismatches robustly
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('server/routers.ts')
          s = p.read_text()
          if s.startswith('// @ts-nocheck\n'):
              s = s[len('// @ts-nocheck\n'):]

          s = s.replace(
            '''const proposalId = await createProposal({
            workspaceId: wsId,
            title: input.proposalTitle,
            opportunityId: input.opportunityId,
            framework: input.framework,
            dueDate: opportunity.dueDate || undefined,
          });''',
            '''const proposalResult = await createProposal({
            workspaceId: wsId,
            title: input.proposalTitle,
            opportunityId: input.opportunityId,
            framework: input.framework,
            dueDate: opportunity.dueDate || undefined,
          });
          const proposalId = Number((proposalResult as any)?.[0]?.insertId ?? (proposalResult as any)?.insertId);
          if (!proposalId) throw new Error("Proposal creation did not return an insert id");''')

          s = s.replace(
            'await db.insert(contactLinks).values({ contactId: c.id, linkedRecordType: "proposal", linkedRecordId: proposalId, workspaceId: wsId });',
            'await db.insert(contactLinks).values({ contactId: c.id, recordType: "proposal", recordId: proposalId, workspaceId: wsId });')
          s = s.replace(
            'await db.insert(contactLinks).values({ contactId: c.id, linkedRecordType: "contract", linkedRecordId: contractId, workspaceId: wsId });',
            'await db.insert(contactLinks).values({ contactId: c.id, recordType: "contract", recordId: contractId, workspaceId: wsId });')
          s = s.replace(
            'await db.insert(fileLinks).values({ fileId: f.id, linkedRecordType: "proposal", linkedRecordId: proposalId, workspaceId: wsId });',
            'await db.insert(fileLinks).values({ fileId: f.id, targetType: "proposal", targetId: proposalId, linkType: "carry_forward", workspaceId: wsId });')
          s = s.replace(
            'await db.insert(fileLinks).values({ fileId: f.id, linkedRecordType: "contract", linkedRecordId: contractId, workspaceId: wsId });',
            'await db.insert(fileLinks).values({ fileId: f.id, targetType: "contract", targetId: contractId, linkType: "carry_forward", workspaceId: wsId });')

          s = s.replace('eqOp(tasksTbl.status, "open")', 'eqOp(tasksTbl.status, "todo")')

          s = s.replace(
            '''const contractId = await createContract({
            workspaceId: wsId,
            title: input.contractTitle,
            proposalId: input.proposalId,
            contractNumber: input.contractNumber || undefined,
          });''',
            '''const contractResult = await createContract({
            workspaceId: wsId,
            title: input.contractTitle,
            proposalId: input.proposalId,
            contractNumber: input.contractNumber || undefined,
          });
          const contractId = Number((contractResult as any)?.[0]?.insertId ?? (contractResult as any)?.insertId);
          if (!contractId) throw new Error("Contract creation did not return an insert id");''')

          # Deliverables are contract-scoped in the current schema. Remove the obsolete
          # proposal-linked copy operation and stop advertising it as enabled-by-default.
          s = re.sub(r'\n\s*if \(cf\.deliverables\) \{.*?\n\s*\}\n\s*await updateProposalStatus',
                     '\n          await updateProposalStatus', s, count=1, flags=re.S)
          s = s.replace('deliverables: z.boolean().default(true),', 'deliverables: z.boolean().default(false),')
          s = s.replace('{ contacts: true, files: true, notes: true, tasks: false, deliverables: true }',
                        '{ contacts: true, files: true, notes: true, tasks: false, deliverables: false }')
          s = s.replace('contacts: contactsTbl, files: filesTbl, notes: notesTbl, tasks: tasksTbl, deliverables: deliverablesTbl, contactLinks, fileLinks',
                        'contacts: contactsTbl, files: filesTbl, notes: notesTbl, tasks: tasksTbl, contactLinks, fileLinks')

          s = s.replace('try { await logAudit(workspaceId, ctx.user.id, "update", "legal", 0, input); } catch {}',
                        'if (workspaceId) { try { await logAudit(workspaceId, userId, "update", "legal", 0, input); } catch {} }')

          p.write_text(s)
          PY

      - name: Verify obsolete lifecycle schema references are gone
        run: |
          ! grep -n 'linkedRecordType: "proposal", linkedRecordId: proposalId' server/routers.ts
          ! grep -n 'linkedRecordType: "contract", linkedRecordId: contractId' server/routers.ts | grep 'contactLinks\|fileLinks'
          ! grep -n 'tasksTbl.status, "open"' server/routers.ts
          ! grep -n 'deliverablesTbl.linkedRecordType\|deliverablesTbl.linkedRecordId' server/routers.ts
          ! head -n 1 server/routers.ts | grep '@ts-nocheck'

      - run: corepack enable && corepack prepare pnpm@10.4.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm drizzle-kit migrate
      - run: pnpm check
      - run: env -u RESEND_API_KEY pnpm test
      - run: pnpm build

      - name: Commit verified central router hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/routers.ts
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "fix(phase3): align lifecycle carry-forward with current schema"
            git push origin HEAD:agent/v2-modernization-phase3
          fi
