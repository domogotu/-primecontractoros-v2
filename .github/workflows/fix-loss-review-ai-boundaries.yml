name: One-time loss review and AI boundary repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Harden loss review and AI record boundaries
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # ---- server/entityRouters.ts ----
          p = Path('server/entityRouters.ts')
          t = p.read_text()

          anchor = 'import { z } from "zod";\n'
          if 'import { getProposal, getContract } from "./db";' not in t:
            t = t.replace(anchor, anchor + 'import { getProposal, getContract } from "./db";\n', 1)

          old = '''  create: protectedProcedure
    .input(z.object({ contractId: z.number().optional(), proposalId: z.number().optional(), title: z.string(), category: z.string().optional(), description: z.string().optional(), impact: z.string().optional(), recommendation: z.string().optional() }))
    .mutation(async ({ ctx, input }) => {
      const wsId = await requireWrite(ctx);
      try { await logAudit(wsId, ctx.user.id, "create", "lessons", 0, input); } catch {}
      return createLessonLearned({ ...input, workspaceId: wsId });
    }),
'''
          new = '''  create: protectedProcedure
    .input(z.object({ contractId: z.number().optional(), proposalId: z.number().optional(), title: z.string(), category: z.string().optional(), description: z.string().optional(), impact: z.string().optional(), recommendation: z.string().optional() }))
    .mutation(async ({ ctx, input }) => {
      const wsId = await requireWrite(ctx);
      if (input.contractId) {
        const contract = await getContract(input.contractId, wsId);
        if (!contract) throw new Error("Contract not found in this workspace");
      }
      if (input.proposalId) {
        const proposal = await getProposal(input.proposalId, wsId);
        if (!proposal) throw new Error("Proposal not found in this workspace");
      }
      try { await logAudit(wsId, ctx.user.id, "create", "lessons", 0, input); } catch {}
      return createLessonLearned({ ...input, workspaceId: wsId });
    }),
'''
          if old not in t:
            raise SystemExit('lessons create anchor not found')
          t = t.replace(old, new, 1)

          old = '''    .mutation(async ({ ctx, input }) => {
      const wsId = await requireWrite(ctx);
      const { reviewDate, ...rest } = input;
      try { await logAudit(wsId, ctx.user.id, "create", "lossReviews", 0, input); } catch {}
      return createLossReview({
        ...rest,
        workspaceId: wsId,
        reviewDate: reviewDate ? new Date(reviewDate) : undefined,
      });
    }),
'''
          new = '''    .mutation(async ({ ctx, input }) => {
      const wsId = await requireWrite(ctx);
      const proposal = await getProposal(input.proposalId, wsId);
      if (!proposal) throw new Error("Proposal not found in this workspace");
      if (proposal.status !== "lost") {
        throw new Error("Loss reviews can only be created for proposals marked Lost.");
      }
      const existingReviews = await listLossReviews(wsId);
      if (existingReviews.some((review: any) => review.proposalId === input.proposalId)) {
        throw new Error("A loss review already exists for this proposal.");
      }
      const { reviewDate, ...rest } = input;
      try { await logAudit(wsId, ctx.user.id, "create", "lossReviews", 0, input); } catch {}
      return createLossReview({
        ...rest,
        workspaceId: wsId,
        reviewDate: reviewDate ? new Date(reviewDate) : undefined,
      });
    }),
'''
          if old not in t:
            raise SystemExit('loss review create anchor not found')
          t = t.replace(old, new, 1)
          p.write_text(t)

          # ---- server/aiRouter.ts ----
          p = Path('server/aiRouter.ts')
          t = p.read_text()
          t = t.replace('import { getDb } from "./db";', 'import { getDb, getContract, getOpportunity, getProposal } from "./db";', 1)
          t = t.replace('  createAlert,\n} from "./entityDb";', '  createAlert,\n  getFileById,\n  getInvoiceById,\n} from "./entityDb";', 1)

          replacements = [
            (
'''      .mutation(async ({ ctx, input }) => {
        await requireActiveWorkspace(ctx, (input as any)?.workspaceId);
        return await runContractScan(
''',
'''      .mutation(async ({ ctx, input }) => {
        await requireActiveWorkspace(ctx, (input as any)?.workspaceId);
        const contract = await getContract(input.contractId, input.workspaceId);
        if (!contract) throw new TRPCError({ code: "NOT_FOUND", message: "Contract not found in this workspace" });
        return await runContractScan(
'''),
            (
'''      .mutation(async ({ ctx, input }) => {
        await requireActiveWorkspace(ctx, (input as any)?.workspaceId);
        return await runOpportunityReview(
''',
'''      .mutation(async ({ ctx, input }) => {
        await requireActiveWorkspace(ctx, (input as any)?.workspaceId);
        const opportunity = await getOpportunity(input.opportunityId, input.workspaceId);
        if (!opportunity) throw new TRPCError({ code: "NOT_FOUND", message: "Opportunity not found in this workspace" });
        return await runOpportunityReview(
'''),
            (
'''      .mutation(async ({ ctx, input }) => {
        await requireActiveWorkspace(ctx, (input as any)?.workspaceId);
        return await runProposalReview(
''',
'''      .mutation(async ({ ctx, input }) => {
        await requireActiveWorkspace(ctx, (input as any)?.workspaceId);
        const proposal = await getProposal(input.proposalId, input.workspaceId);
        if (!proposal) throw new TRPCError({ code: "NOT_FOUND", message: "Proposal not found in this workspace" });
        return await runProposalReview(
'''),
            (
'''      .mutation(async ({ ctx, input }) => {
        await requireActiveWorkspace(ctx, (input as any)?.workspaceId);
        return await runFileAnalysis(
''',
'''      .mutation(async ({ ctx, input }) => {
        await requireActiveWorkspace(ctx, (input as any)?.workspaceId);
        const file = await getFileById(input.fileId, input.workspaceId);
        if (!file) throw new TRPCError({ code: "NOT_FOUND", message: "File not found in this workspace" });
        return await runFileAnalysis(
'''),
            (
'''      .mutation(async ({ ctx, input }) => {
        await requireActiveWorkspace(ctx, (input as any)?.workspaceId);
        return await runInvoiceReview(
''',
'''      .mutation(async ({ ctx, input }) => {
        await requireActiveWorkspace(ctx, (input as any)?.workspaceId);
        const invoice = await getInvoiceById(input.invoiceId, input.workspaceId);
        if (!invoice) throw new TRPCError({ code: "NOT_FOUND", message: "Invoice not found in this workspace" });
        return await runInvoiceReview(
'''),
          ]
          for old, new in replacements:
            if old not in t:
              raise SystemExit('AI boundary anchor not found')
            t = t.replace(old, new, 1)
          p.write_text(t)

          # ---- client/src/pages/LossReview.tsx ----
          p = Path('client/src/pages/LossReview.tsx')
          t = p.read_text()
          t = t.replace('      workspaceId: review.workspaceId || 1,', '      workspaceId: review.workspaceId,', 1)
          t = t.replace('''  const handleAnalyze = () => {
    setLoading(true);
    aiMutation.mutate({
''', '''  const handleAnalyze = () => {
    if (!review.workspaceId) {
      toast.error("Workspace context is missing for this loss review.");
      return;
    }
    setLoading(true);
    aiMutation.mutate({
''', 1)
          t = t.replace('const createLesson = trpc.lessons.create.useMutation({', 'const createLesson = trpc.lessonsLearnedV2.create.useMutation({', 1)
          t = t.replace('''        <Button size="sm" onClick={() => createLesson.mutate({ title, description, proposalId: review.proposalId })}
''', '''        <Button size="sm" onClick={() => createLesson.mutate({
          title,
          description,
          proposalId: review.proposalId,
          lessonType: "proposal_loss",
          linkedRecordType: "proposal",
          linkedRecordId: review.proposalId,
          linkedRecordTitle: `Proposal #${review.proposalId}`,
        })}
''', 1)
          t = t.replace('''  const createMutation = trpc.lossReviews.create.useMutation({
    onSuccess: () => { refetch(); setShowForm(false); setForm({ proposalId: "", reviewDate: "", reasonLost: "", competitorInfo: "", lessonsLearned: "", actionItems: "" }); toast.success("Loss review created"); },
  });
''', '''  const createMutation = trpc.lossReviews.create.useMutation({
    onSuccess: () => { refetch(); setShowForm(false); setForm({ proposalId: "", reviewDate: "", reasonLost: "", competitorInfo: "", lessonsLearned: "", actionItems: "" }); toast.success("Loss review created"); },
    onError: (e: any) => toast.error(e.message || "Unable to create loss review"),
  });
''', 1)
          t = t.replace('''  const updateMutation = trpc.lossReviews.update.useMutation({
    onSuccess: () => { refetch(); toast.success("Review updated"); },
  });
''', '''  const updateMutation = trpc.lossReviews.update.useMutation({
    onSuccess: () => { refetch(); toast.success("Review updated"); },
    onError: (e: any) => toast.error(e.message || "Unable to update loss review"),
  });
''', 1)
          p.write_text(t)
          PY

      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/entityRouters.ts server/aiRouter.ts client/src/pages/LossReview.tsx
          if git diff --cached --quiet; then
            echo 'No repair needed.'
          else
            git commit -m 'fix(lifecycle): harden loss review and AI workspace boundaries'
            git push origin HEAD:main
          fi
