name: One-time lessons client link type repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align Lessons client link type with API
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('client/src/pages/LessonsLearned.tsx')
          text = path.read_text()
          old = '    linkedRecordType: "",\n    linkedRecordId: undefined as number | undefined,'
          new = '    linkedRecordType: "" as "" | "contract" | "proposal" | "opportunity",\n    linkedRecordId: undefined as number | undefined,'
          if old not in text:
            raise SystemExit('Lessons client form link type anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/src/pages/LessonsLearned.tsx
          if git diff --cached --quiet; then
            echo 'No repair needed.'
          else
            git commit -m 'fix(lessons): align client linked record type with API'
            git push origin HEAD:main
          fi
