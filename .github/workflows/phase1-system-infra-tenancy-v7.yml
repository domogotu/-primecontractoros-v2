name: Phase 1 system infrastructure tenancy v7

on:
  push:
    branches:
      - agent/v2-modernization-phase1
    paths:
      - .github/workflows/phase1-system-infra-tenancy-v7.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: primecontractoros_test
          MYSQL_USER: user
          MYSQL_PASSWORD: pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uuser -ppass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql://user:pass@127.0.0.1:3306/primecontractoros_test
      JWT_SECRET: phase1-validation-only-not-a-secret
      VITE_APP_ID: phase1-validation
      OAUTH_SERVER_URL: https://example.invalid
      VITE_OAUTH_PORTAL_URL: https://example.invalid
      OWNER_OPEN_ID: phase1-owner
      OWNER_NAME: Phase1 Owner
      OPENAI_API_KEY: sk-test-dummy-phase1-validation
      SAM_GOV_API_KEY: phase1-test
      STRIPE_SECRET_KEY: sk_test_phase1_validation
      STRIPE_PUBLISHABLE_KEY: pk_test_phase1_validation
      STRIPE_WEBHOOK_SECRET: whsec_phase1_validation
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v2-modernization-phase1
          fetch-depth: 0

      - name: Patch tenant boundaries by named section
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('server/systemInfraRouter.ts')
          s=p.read_text()

          def section(start,end=None):
            a=s.index(start)
            b=s.index(end,a) if end else len(s)
            return a,b,s[a:b]

          s=s.replace('import { router, protectedProcedure } from "./_core/trpc";','import { router, protectedProcedure } from "./_core/trpc";\nimport { TRPCError } from "@trpc/server";\nimport { requireWorkspaceId } from "./workspaceMiddleware";',1)
          s=s.replace('export const systemInfraRouter = router({','''async function requireActiveWorkspace(ctx: any, requestedWorkspaceId?: number): Promise<number> {
            if (!ctx.user?.id) throw new TRPCError({ code: "UNAUTHORIZED" });
            const workspaceId = await requireWorkspaceId(ctx.user.id);
            if (requestedWorkspaceId !== undefined && requestedWorkspaceId !== workspaceId) {
              throw new TRPCError({ code: "FORBIDDEN", message: "Workspace access denied" });
            }
            return workspaceId;
          }

          async function requireSupportTicketInWorkspace(ticketId: number, workspaceId: number) {
            const db = await getDb();
            if (!db) throw new Error("Database not available");
            const [ticket] = await db.select().from(supportTickets)
              .where(and(eq(supportTickets.id, ticketId), eq(supportTickets.workspaceId, workspaceId)))
              .limit(1);
            if (!ticket) throw new TRPCError({ code: "NOT_FOUND", message: "Support ticket not found" });
            return ticket;
          }

          export const systemInfraRouter = router({''',1)

          # Mark-read segment.
          a,b,seg=section('markRead: protectedProcedure','markAllRead: protectedProcedure')
          seg=seg.replace('.mutation(async ({ input }) => {','.mutation(async ({ ctx, input }) => {',1)
          seg=seg.replace('await db.update(notifications).set({ isRead: true }).where(eq(notifications.id, input.notificationId));','const tenantWorkspaceId = await requireActiveWorkspace(ctx);\n        await db.update(notifications).set({ isRead: true }).where(and(eq(notifications.id, input.notificationId), eq(notifications.workspaceId, tenantWorkspaceId)));',1)
          s=s[:a]+seg+s[b:]

          # Dismiss segment.
          a,b,seg=section('dismiss: protectedProcedure','// ============================================================\n  // Global Search')
          seg=seg.replace('.mutation(async ({ input }) => {','.mutation(async ({ ctx, input }) => {',1)
          seg=seg.replace('await db.update(notifications).set({ dismissedAt: new Date() }).where(eq(notifications.id, input.notificationId));','const tenantWorkspaceId = await requireActiveWorkspace(ctx);\n        await db.update(notifications).set({ dismissedAt: new Date() }).where(and(eq(notifications.id, input.notificationId), eq(notifications.workspaceId, tenantWorkspaceId)));',1)
          s=s[:a]+seg+s[b:]

          # Support segment handles optional workspace and ID-only mutations.
          a,b,seg=section('support: router({')
          seg=seg.replace('const conditions: any[] = [];','const tenantWorkspaceId = await requireActiveWorkspace(ctx, input?.workspaceId);\n        const conditions: any[] = [eq(supportTickets.workspaceId, tenantWorkspaceId)];',1)
          seg=seg.replace('if (input?.workspaceId) conditions.push(eq(supportTickets.workspaceId, input.workspaceId));\n','',1)
          marker='const updateData: any = { status: input.status };'
          if marker not in seg: raise SystemExit('support status marker missing')
          seg=seg.replace(marker,'const tenantWorkspaceId = await requireActiveWorkspace(ctx);\n        await requireSupportTicketInWorkspace(input.id, tenantWorkspaceId);\n        '+marker,1)
          seg=seg.replace('await db.update(supportTickets).set(updateData).where(eq(supportTickets.id, input.id));','await db.update(supportTickets).set(updateData).where(and(eq(supportTickets.id, input.id), eq(supportTickets.workspaceId, tenantWorkspaceId)));',1)
          seg=seg.replace('workspaceId: 0,','workspaceId: tenantWorkspaceId,',1)
          note_marker='await logAuditEvent({\n          workspaceId: tenantWorkspaceId,'
          if note_marker not in seg: raise SystemExit('support note marker missing')
          seg=seg.replace(note_marker,'const tenantWorkspaceId = await requireActiveWorkspace(ctx);\n        await requireSupportTicketInWorkspace(input.ticketId, tenantWorkspaceId);\n        '+note_marker,1)
          s=s[:a]+seg

          # All input-bearing callbacks now check caller-supplied workspaceId against active membership.
          s=s.replace('.query(async ({ input }) => {','.query(async ({ ctx, input }) => {')
          s=s.replace('.mutation(async ({ input }) => {','.mutation(async ({ ctx, input }) => {')
          lines=s.splitlines()
          out=[]
          for line in lines:
            out.append(line)
            if '.query(async ({ ctx, input }) => {' in line or '.mutation(async ({ ctx, input }) => {' in line:
              indent=line[:len(line)-len(line.lstrip())]+'  '
              out.append(indent+'await requireActiveWorkspace(ctx, (input as any)?.workspaceId);')
          s='\n'.join(out)+'\n'

          required=['Workspace access denied','eq(notifications.workspaceId, tenantWorkspaceId)','const conditions: any[] = [eq(supportTickets.workspaceId, tenantWorkspaceId)]','requireSupportTicketInWorkspace(input.id, tenantWorkspaceId)','requireSupportTicketInWorkspace(input.ticketId, tenantWorkspaceId)']
          for x in required:
            if x not in s: raise SystemExit('missing '+x)
          p.write_text(s)
          PY

      - name: Add regression coverage
        shell: bash
        run: |
          cat > server/systemInfraTenancy.test.ts <<'EOF'
          import { describe, expect, it } from "vitest";
          import { readFileSync } from "node:fs";
          import { fileURLToPath } from "node:url";
          import { dirname, join } from "node:path";
          const here=dirname(fileURLToPath(import.meta.url));
          const source=readFileSync(join(here,"systemInfraRouter.ts"),"utf8");
          describe("system infrastructure tenant isolation",()=>{
            it("resolves active workspace",()=>{
              expect(source).toContain("requireWorkspaceId(ctx.user.id)");
              expect(source).toContain("Workspace access denied");
              expect(source.match(/requireActiveWorkspace\(ctx, \(input as any\)\?\.workspaceId\)/g)?.length || 0).toBeGreaterThan(10);
            });
            it("scopes notification id writes",()=>expect(source).toContain("eq(notifications.workspaceId, tenantWorkspaceId)"));
            it("scopes support operations",()=>{
              const support=source.slice(source.indexOf("support: router({"));
              expect(support).toContain("const conditions: any[] = [eq(supportTickets.workspaceId, tenantWorkspaceId)]");
              expect(support).toContain("requireSupportTicketInWorkspace(input.id, tenantWorkspaceId)");
              expect(support).toContain("requireSupportTicketInWorkspace(input.ticketId, tenantWorkspaceId)");
              expect(support).not.toContain("workspaceId: 0");
            });
          });
          EOF

      - run: corepack enable && corepack prepare pnpm@10.4.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm drizzle-kit migrate
      - run: pnpm check
      - run: env -u RESEND_API_KEY pnpm test
      - run: pnpm build
      - name: Commit verified patch
        shell: bash
        run: |
          rm -f .github/workflows/phase1-system-infra-tenancy-v7.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(security): enforce system infrastructure workspace isolation'
          git push origin HEAD:agent/v2-modernization-phase1
