name: Phase 16 release readiness
on:
  push:
    branches: [agent/phase16-release-readiness]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: primecontractoros_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/primecontractoros_test
      JWT_SECRET: phase16-release-readiness-secret-long-enough
      VITE_APP_ID: phase16-test-app
      OAUTH_SERVER_URL: https://api.example.com
      VITE_OAUTH_PORTAL_URL: https://login.example.com
      OWNER_EMAIL: dominiquereed35@gmail.com
      OWNER_OPEN_ID: phase16-owner-open-id
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - name: Verify production release invariants
        run: |
          grep -q 'healthCheckPath: /api/health' render.yaml
          grep -q 'pnpm drizzle-kit migrate && node dist/index.js' render.yaml
          grep -q 'OWNER_EMAIL' render.yaml
          grep -q 'dominiquereed35@gmail.com' render.yaml
          grep -q 'VITE_OAUTH_PORTAL_URL' render.yaml
          grep -q 'STRIPE_WEBHOOK_SECRET' render.yaml
          grep -q 'platformOwnerProcedure' server/platformAdminRouter.ts
          grep -q 'Checkout metadata is the source of truth' server/integrationsRouter.ts
          grep -q 'Stripe subscription before granting access' server/integrationsRouter.ts
          grep -q '/checkout/success' client/src/App.tsx
          grep -q '/app/onboarding' client/src/App.tsx
          grep -q '/app/dashboard' client/src/App.tsx
          grep -q '/platform' client/src/App.tsx
      - run: corepack enable && corepack prepare pnpm@10.4.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm drizzle-kit migrate
      - run: pnpm check
      - run: env -u RESEND_API_KEY pnpm test
      - run: pnpm build
