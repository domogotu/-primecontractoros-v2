name: Phase 10 auth readiness

on:
  push:
    branches:
      - agent/phase10-auth-dependency-readiness

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: primecontractoros_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/primecontractoros_test
      JWT_SECRET: phase10-validation-secret-that-is-long-enough
      VITE_APP_ID: phase10-test-app
      OAUTH_SERVER_URL: https://example.com
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - name: Verify Phase 10 assertions
        run: |
          grep -q 'validateProductionCoreEnv' server/_core/index.ts
          grep -q 'Missing required production environment variables' server/_core/env.ts
          grep -q 'JWT_SECRET must be at least 32 characters' server/_core/env.ts
          grep -q 'OAUTH_SERVER_URL must use HTTPS' server/_core/env.ts
      - run: corepack enable && corepack prepare pnpm@10.4.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm drizzle-kit migrate
      - run: pnpm check
      - run: env -u RESEND_API_KEY pnpm test
      - run: pnpm build
