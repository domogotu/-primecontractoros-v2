name: Phase 2 router correctness

on:
  push:
    branches:
      - agent/v2-modernization-phase2
    paths:
      - .github/workflows/phase2-router-correctness.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: primecontractoros_test
          MYSQL_USER: user
          MYSQL_PASSWORD: pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uuser -ppass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql://user:pass@127.0.0.1:3306/primecontractoros_test
      JWT_SECRET: phase2-validation-only-not-a-secret
      VITE_APP_ID: phase2-validation
      OAUTH_SERVER_URL: https://example.invalid
      VITE_OAUTH_PORTAL_URL: https://example.invalid
      OWNER_OPEN_ID: phase2-owner
      OWNER_NAME: Phase2 Owner
      OPENAI_API_KEY: sk-test-dummy-phase2-validation
      SAM_GOV_API_KEY: phase2-test
      STRIPE_SECRET_KEY: sk_test_phase2_validation
      STRIPE_PUBLISHABLE_KEY: pk_test_phase2_validation
      STRIPE_WEBHOOK_SECRET: whsec_phase2_validation
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v2-modernization-phase2
          fetch-depth: 0

      - name: Repair router authorization and diagnostics semantics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # batch3: scope invite revoke, make diagnostics truthful, remove ts-nocheck.
          p=Path('server/batch3Router.ts')
          s=p.read_text()
          s=s.replace('// @ts-nocheck\n','',1)
          old='''  runCheck: protectedProcedure.input(z.object({ checkType: z.string() })).mutation(async ({ ctx, input }) => {
            return { checkType: input.checkType, status: "passed", details: "All checks passed", timestamp: new Date().toISOString() };
          }),'''
          new='''  runCheck: protectedProcedure.input(z.object({ checkType: z.string() })).mutation(async ({ ctx, input }) => {
            const db = await getDb();
            const wsId = await requireWorkspaceId(ctx.user.id);
            try {
              await db.select({ id: invites.id }).from(invites).where(eq(invites.workspaceId, wsId)).limit(1);
              return { checkType: input.checkType, status: "passed", details: "Database and workspace access verified", timestamp: new Date().toISOString() };
            } catch (error) {
              return { checkType: input.checkType, status: "failed", details: error instanceof Error ? error.message : "Diagnostic check failed", timestamp: new Date().toISOString() };
            }
          }),'''
          if old not in s: raise SystemExit('diagnostics target missing')
          s=s.replace(old,new,1)
          old='''  revoke: protectedProcedure.input(z.object({ id: z.number() })).mutation(async ({ ctx, input }) => {
            const db = await getDb();
            await db.update(invites).set({ status: "revoked" }).where(eq(invites.id, input.id));
            return { success: true };
          }),'''
          new='''  revoke: protectedProcedure.input(z.object({ id: z.number() })).mutation(async ({ ctx, input }) => {
            const db = await getDb();
            const wsId = await requireWorkspaceId(ctx.user.id);
            await db.update(invites).set({ status: "revoked" }).where(and(eq(invites.id, input.id), eq(invites.workspaceId, wsId)));
            return { success: true };
          }),'''
          if old not in s: raise SystemExit('invite revoke target missing')
          s=s.replace(old,new,1)
          s=s.replace('import { eq, desc } from "drizzle-orm";','import { eq, desc, and } from "drizzle-orm";',1)
          p.write_text(s)

          # batch4: scope ID-only reads/writes and remove ts-nocheck.
          p=Path('server/batch4Router.ts')
          s=p.read_text()
          s=s.replace('// @ts-nocheck\n','',1)
          old='''  get: protectedProcedure.input(z.object({ id: z.number() })).query(async ({ ctx, input }) => {
            const db = await getDb();
            const rows = await db.select().from(generatedDocuments).where(eq(generatedDocuments.id, input.id));
            return rows[0] || null;
          }),'''
          new='''  get: protectedProcedure.input(z.object({ id: z.number() })).query(async ({ ctx, input }) => {
            const db = await getDb();
            const wsId = await requireWorkspaceId(ctx.user.id);
            const rows = await db.select().from(generatedDocuments).where(and(eq(generatedDocuments.id, input.id), eq(generatedDocuments.workspaceId, wsId)));
            return rows[0] || null;
          }),'''
          if old not in s: raise SystemExit('generated document get target missing')
          s=s.replace(old,new,1)
          old='''    await db.update(flowdownReviews).set(data).where(eq(flowdownReviews.id, id));'''
          new='''    await db.update(flowdownReviews).set(data).where(and(eq(flowdownReviews.id, id), eq(flowdownReviews.workspaceId, wsId)));'''
          if old not in s: raise SystemExit('flowdown update target missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY

      - name: Add regression coverage
        shell: bash
        run: |
          cat > server/phase2RouterCorrectness.test.ts <<'EOF'
          import { describe, expect, it } from "vitest";
          import { readFileSync } from "node:fs";
          import { fileURLToPath } from "node:url";
          import { dirname, join } from "node:path";
          const here = dirname(fileURLToPath(import.meta.url));
          const batch3 = readFileSync(join(here, "batch3Router.ts"), "utf8");
          const batch4 = readFileSync(join(here, "batch4Router.ts"), "utf8");
          describe("phase 2 router correctness", () => {
            it("scopes invite revocation to the active workspace", () => {
              expect(batch3).toContain("and(eq(invites.id, input.id), eq(invites.workspaceId, wsId))");
            });
            it("does not report diagnostics as unconditionally passed", () => {
              expect(batch3).toContain('status: "failed"');
              expect(batch3).not.toContain('details: "All checks passed"');
            });
            it("scopes generated document reads", () => {
              expect(batch4).toContain("and(eq(generatedDocuments.id, input.id), eq(generatedDocuments.workspaceId, wsId))");
            });
            it("scopes flowdown review updates", () => {
              expect(batch4).toContain("and(eq(flowdownReviews.id, id), eq(flowdownReviews.workspaceId, wsId))");
            });
            it("keeps these routers type checked", () => {
              expect(batch3).not.toContain("@ts-nocheck");
              expect(batch4).not.toContain("@ts-nocheck");
            });
          });
          EOF

      - run: corepack enable && corepack prepare pnpm@10.4.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm drizzle-kit migrate
      - run: pnpm check
      - run: env -u RESEND_API_KEY pnpm test
      - run: pnpm build

      - name: Commit verified Phase 2 batch
        shell: bash
        run: |
          rm -f .github/workflows/phase2-router-correctness.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(phase2): enforce router authorization and truthful diagnostics'
          git push origin HEAD:agent/v2-modernization-phase2
