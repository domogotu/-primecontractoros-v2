name: One-time contract health state repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair contract health UI state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('client/src/pages/ContractDetail.tsx')
          text = path.read_text()

          old = """  const updateHealthMutation = trpc.contracts.updateHealth.useMutation();\n  const utils = trpc.useUtils();\n\n"""
          new = """  const utils = trpc.useUtils();\n  const updateHealthMutation = trpc.contracts.updateHealth.useMutation({\n    onSuccess: async () => {\n      await Promise.all([\n        utils.contracts.get.invalidate({ id: contractId! }),\n        utils.contracts.list.invalidate(),\n      ]);\n      toast.success('Contract health updated');\n    },\n    onError: (error: any) => toast.error(error.message || 'Failed to update contract health'),\n  });\n\n"""

          if old not in text:
              raise SystemExit('Expected ContractDetail health mutation block was not found; refusing to modify the file.')

          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/src/pages/ContractDetail.tsx
          if git diff --cached --quiet; then
            echo 'No repair needed.'
          else
            git commit -m 'fix(contracts): refresh health state after updates'
            git push origin HEAD:main
          fi
