name: Phase 1 system infrastructure tenancy v3

on:
  push:
    branches:
      - agent/v2-modernization-phase1
    paths:
      - .github/workflows/phase1-system-infra-tenancy-v3.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: primecontractoros_test
          MYSQL_USER: user
          MYSQL_PASSWORD: pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uuser -ppass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql://user:pass@127.0.0.1:3306/primecontractoros_test
      JWT_SECRET: phase1-validation-only-not-a-secret
      VITE_APP_ID: phase1-validation
      OAUTH_SERVER_URL: https://example.invalid
      VITE_OAUTH_PORTAL_URL: https://example.invalid
      OWNER_OPEN_ID: phase1-owner
      OWNER_NAME: Phase1 Owner
      OPENAI_API_KEY: sk-test-dummy-phase1-validation
      SAM_GOV_API_KEY: phase1-test
      STRIPE_SECRET_KEY: sk_test_phase1_validation
      STRIPE_PUBLISHABLE_KEY: pk_test_phase1_validation
      STRIPE_WEBHOOK_SECRET: whsec_phase1_validation
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v2-modernization-phase1
          fetch-depth: 0

      - name: Apply targeted tenancy hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('server/systemInfraRouter.ts')
          s = p.read_text()

          # Imports + common tenant helpers.
          if 'import { TRPCError } from "@trpc/server";' not in s:
              s = s.replace(
                  'import { router, protectedProcedure } from "./_core/trpc";',
                  'import { router, protectedProcedure } from "./_core/trpc";\nimport { TRPCError } from "@trpc/server";\nimport { requireWorkspaceId } from "./workspaceMiddleware";',
                  1,
              )

          helper_anchor = 'export const systemInfraRouter = router({'
          if 'async function requireActiveWorkspace' not in s:
              helper = '''async function requireActiveWorkspace(ctx: any, requestedWorkspaceId?: number): Promise<number> {
            if (!ctx.user?.id) throw new TRPCError({ code: "UNAUTHORIZED" });
            const workspaceId = await requireWorkspaceId(ctx.user.id);
            if (requestedWorkspaceId !== undefined && requestedWorkspaceId !== workspaceId) {
              throw new TRPCError({ code: "FORBIDDEN", message: "Workspace access denied" });
            }
            return workspaceId;
          }

          async function requireSupportTicketInWorkspace(ticketId: number, workspaceId: number) {
            const db = await getDb();
            if (!db) throw new Error("Database not available");
            const [ticket] = await db.select().from(supportTickets)
              .where(and(eq(supportTickets.id, ticketId), eq(supportTickets.workspaceId, workspaceId)))
              .limit(1);
            if (!ticket) throw new TRPCError({ code: "NOT_FOUND", message: "Support ticket not found" });
            return ticket;
          }

          '''
              if helper_anchor not in s:
                  raise SystemExit('system router anchor missing')
              s = s.replace(helper_anchor, helper + helper_anchor, 1)

          # Every protected route with a caller-provided required workspaceId must resolve the active workspace.
          # Add ctx to input-only callbacks, then inject a guard when the immediately preceding input schema contains workspaceId.
          s = s.replace('.query(async ({ input }) => {', '.query(async ({ ctx, input }) => {')
          s = s.replace('.mutation(async ({ input }) => {', '.mutation(async ({ ctx, input }) => {')
          lines = s.splitlines()
          out = []
          for i, line in enumerate(lines):
              out.append(line)
              if '.query(async ({ ctx, input }) => {' in line or '.mutation(async ({ ctx, input }) => {' in line:
                  prior = '\n'.join(lines[max(0, i - 16):i])
                  following = '\n'.join(lines[i + 1:i + 5])
                  if 'workspaceId: z.number()' in prior and 'workspaceId: z.number().optional()' not in prior:
                      if 'requireActiveWorkspace(ctx, input.workspaceId)' not in following:
                          indent = line[:len(line) - len(line.lstrip())] + '  '
                          out.append(indent + 'await requireActiveWorkspace(ctx, input.workspaceId);')
          s = '\n'.join(out) + '\n'

          # Notification ID-only mutations: scope by active workspace.
          mark_read_pattern = re.compile(r'''(markRead:\s*protectedProcedure[\s\S]*?\.mutation\(async \(\{ ctx, input \}\) => \{\s*const db = await getDb\(\);\s*if \(!db\) return \{ success: false \};)\s*await db\.update\(notifications\)\.set\(\{ isRead: true \}\)\.where\(eq\(notifications\.id, input\.notificationId\)\);''')
          s, n = mark_read_pattern.subn(r'''\1
              const wsId = await requireActiveWorkspace(ctx);
              await db.update(notifications).set({ isRead: true })
                .where(and(eq(notifications.id, input.notificationId), eq(notifications.workspaceId, wsId)));''', s, count=1)
          if n != 1:
              raise SystemExit('markRead patch not applied')

          dismiss_pattern = re.compile(r'''(dismiss:\s*protectedProcedure[\s\S]*?\.mutation\(async \(\{ ctx, input \}\) => \{\s*const db = await getDb\(\);\s*if \(!db\) return \{ success: false \};)\s*await db\.update\(notifications\)\.set\(\{ dismissedAt: new Date\(\) \}\)\.where\(eq\(notifications\.id, input\.notificationId\)\);''')
          s, n = dismiss_pattern.subn(r'''\1
              const wsId = await requireActiveWorkspace(ctx);
              await db.update(notifications).set({ dismissedAt: new Date() })
                .where(and(eq(notifications.id, input.notificationId), eq(notifications.workspaceId, wsId)));''', s, count=1)
          if n != 1:
              raise SystemExit('dismiss patch not applied')

          # Optional support.workspaceId cannot mean unrestricted access.
          support_section_start = s.index('support: router({')
          support = s[support_section_start:]
          support, n = re.subn(
              r'''(list:\s*protectedProcedure[\s\S]*?\.query\(async \(\{ ctx, input \}\) => \{\s*const db = await getDb\(\);\s*if \(!db\) return \[\];)\s*const conditions: any\[\] = \[\];\s*if \(input\?\.workspaceId\) conditions\.push\(eq\(supportTickets\.workspaceId, input\.workspaceId\)\);''',
              r'''\1
              const wsId = await requireActiveWorkspace(ctx, input?.workspaceId);
              const conditions: any[] = [eq(supportTickets.workspaceId, wsId)];''',
              support,
              count=1,
          )
          if n != 1:
              raise SystemExit('support list patch not applied')

          # Support create: required workspaceId has already been guarded; store the resolved ID explicitly.
          support, n = re.subn(
              r'''(create:\s*protectedProcedure[\s\S]*?\.mutation\(async \(\{ ctx, input \}\) => \{\s*)(await requireActiveWorkspace\(ctx, input\.workspaceId\);\s*)?(const db = await getDb\(\);\s*if \(!db\) return \{ success: false \};)\s*await db\.insert\(supportTickets\)\.values\(\{\s*\.\.\.input,\s*userId: ctx\.user\.id,\s*\}\);''',
              r'''\1\3
              const wsId = await requireActiveWorkspace(ctx, input.workspaceId);
              await db.insert(supportTickets).values({
                ...input,
                workspaceId: wsId,
                userId: ctx.user.id,
              });''',
              support,
              count=1,
          )
          if n != 1:
              raise SystemExit('support create patch not applied')

          # Support status update: parent ownership before write and workspace predicate on write.
          support, n = re.subn(
              r'''(updateStatus:\s*protectedProcedure[\s\S]*?\.mutation\(async \(\{ ctx, input \}\) => \{\s*const db = await getDb\(\);\s*if \(!db\) return \{ success: false \};)\s*const updateData: any = \{ status: input\.status \};''',
              r'''\1
              const wsId = await requireActiveWorkspace(ctx);
              await requireSupportTicketInWorkspace(input.id, wsId);
              const updateData: any = { status: input.status };''',
              support,
              count=1,
          )
          if n != 1:
              raise SystemExit('support status parent patch not applied')
          support = support.replace(
              'await db.update(supportTickets).set(updateData).where(eq(supportTickets.id, input.id));',
              'await db.update(supportTickets).set(updateData).where(and(eq(supportTickets.id, input.id), eq(supportTickets.workspaceId, wsId)));',
              1,
          )

          # Support note: validate ticket and record real workspace instead of workspace 0.
          support, n = re.subn(
              r'''(addNote:\s*protectedProcedure[\s\S]*?\.mutation\(async \(\{ ctx, input \}\) => \{)\s*await logAuditEvent\(\{\s*workspaceId: 0,''',
              r'''\1
              const wsId = await requireActiveWorkspace(ctx);
              await requireSupportTicketInWorkspace(input.ticketId, wsId);
              await logAuditEvent({
                workspaceId: wsId,''',
              support,
              count=1,
          )
          if n != 1:
              raise SystemExit('support note patch not applied')

          s = s[:support_section_start] + support

          # Required-workspace route guards need only reject mismatched IDs; existing DB predicates remain valid.
          required = [
              'requireWorkspaceId(ctx.user.id)',
              'Workspace access denied',
              'and(eq(notifications.id, input.notificationId), eq(notifications.workspaceId, wsId))',
              'const conditions: any[] = [eq(supportTickets.workspaceId, wsId)]',
              'requireSupportTicketInWorkspace(input.id, wsId)',
              'requireSupportTicketInWorkspace(input.ticketId, wsId)',
          ]
          for item in required:
              if item not in s:
                  raise SystemExit('missing invariant: ' + item)

          p.write_text(s)
          PY

      - name: Add tenancy regression tests
        run: |
          cat > server/systemInfraTenancy.test.ts <<'EOF'
          import { describe, expect, it } from "vitest";
          import { readFileSync } from "node:fs";
          import { fileURLToPath } from "node:url";
          import { dirname, join } from "node:path";

          const here = dirname(fileURLToPath(import.meta.url));
          const source = readFileSync(join(here, "systemInfraRouter.ts"), "utf8");

          describe("system infrastructure tenant isolation", () => {
            it("validates caller-supplied workspace IDs against the active workspace", () => {
              expect(source).toContain("requireWorkspaceId(ctx.user.id)");
              expect(source).toContain("Workspace access denied");
              expect(source.match(/requireActiveWorkspace\(ctx, input\.workspaceId\)/g)?.length || 0).toBeGreaterThan(7);
            });

            it("scopes notification ID mutations by the active workspace", () => {
              expect(source).toContain("and(eq(notifications.id, input.notificationId), eq(notifications.workspaceId, wsId))");
            });

            it("always scopes support listing to the active workspace", () => {
              expect(source).toContain("const conditions: any[] = [eq(supportTickets.workspaceId, wsId)]");
            });

            it("validates support ticket ownership before status and note actions", () => {
              const support = source.slice(source.indexOf("support: router({"));
              expect(support).toContain("requireSupportTicketInWorkspace(input.id, wsId)");
              expect(support).toContain("requireSupportTicketInWorkspace(input.ticketId, wsId)");
              expect(support).not.toContain("workspaceId: 0");
            });
          });
          EOF

      - run: corepack enable && corepack prepare pnpm@10.4.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm drizzle-kit migrate
      - run: pnpm check
      - run: env -u RESEND_API_KEY pnpm test
      - run: pnpm build

      - name: Commit verified batch
        run: |
          rm -f .github/workflows/phase1-system-infra-tenancy-v3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(security): enforce system infrastructure workspace isolation'
          git push origin HEAD:agent/v2-modernization-phase1
