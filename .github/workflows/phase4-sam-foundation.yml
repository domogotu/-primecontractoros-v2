name: Phase 4 SAM intake foundation
on:
  push:
    branches: [agent/phase4-opportunity-intake]
    paths: [.github/workflows/phase4-sam-foundation.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: primecontractoros_test
          MYSQL_USER: user
          MYSQL_PASSWORD: pass
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uuser -ppass"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: mysql://user:pass@127.0.0.1:3306/primecontractoros_test
      JWT_SECRET: phase4-validation-only
      VITE_APP_ID: phase4-validation
      OAUTH_SERVER_URL: https://example.invalid
      VITE_OAUTH_PORTAL_URL: https://example.invalid
      OWNER_OPEN_ID: phase4-owner
      OWNER_NAME: Phase4 Owner
      OPENAI_API_KEY: sk-test-dummy
      SAM_GOV_API_KEY: phase4-test
      STRIPE_SECRET_KEY: sk_test_phase4
      STRIPE_PUBLISHABLE_KEY: pk_test_phase4
      STRIPE_WEBHOOK_SECRET: whsec_phase4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase4-opportunity-intake
          fetch-depth: 0
      - name: Harden SAM intake foundation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('server/samRouter.ts')
          s = p.read_text()

          # Normalize insert-id handling for mysql/drizzle return shapes.
          s = s.replace(
            '      const opportunityId = (insertResult as any)?.[0]?.insertId;\n',
            '      const opportunityId = resolveInsertId(insertResult);\n      if (!opportunityId) throw new TRPCError({ code: "INTERNAL_SERVER_ERROR", message: "Opportunity import did not return an insert id" });\n'
          )
          s = s.replace('      const runId = (runResult as any)?.[0]?.insertId;\n', '      const runId = resolveInsertId(runResult);\n      if (!runId) throw new TRPCError({ code: "INTERNAL_SERVER_ERROR", message: "Import run did not return an insert id" });\n')
          s = s.replace('          const oppId = (result as any)?.[0]?.insertId;\n', '          const oppId = resolveInsertId(result);\n')
          s = s.replace('      return { success: true, id: (result as any)?.[0]?.insertId || 0 };\n', '      return { success: true, id: resolveInsertId(result) };\n')

          # Keep all SAM mutations workspace-scoped, including the final UPDATE and attachment dedupe.
          s = s.replace('.where(eq(opportunities.id, input.opportunityId));', '.where(and(eq(opportunities.id, input.opportunityId), eq(opportunities.workspaceId, wsId)));')
          s = s.replace(
            '              eq(opportunitySourceFiles.opportunityId, input.opportunityId),\n              eq(opportunitySourceFiles.fileName, att.name || "Unnamed")',
            '              eq(opportunitySourceFiles.workspaceId, wsId),\n              eq(opportunitySourceFiles.opportunityId, input.opportunityId),\n              eq(opportunitySourceFiles.fileName, att.name || "Unnamed")'
          )
          s = s.replace('      }).where(eq(opportunityImportRuns.id, runId));', '      }).where(and(eq(opportunityImportRuns.id, runId), eq(opportunityImportRuns.workspaceId, wsId)));')

          # Legacy single-item import must obey the same duplicate rules as URL/bulk intake.
          target = '      if (!db) throw new Error("Database not available");\n\n      const result = await db.insert(opportunities).values({'
          repl = '''      if (!db) throw new Error("Database not available");\n\n      const dupCheck = await checkForDuplicate(db, wsId, input.noticeId, input.noticeId, input.solicitationNumber || null, input.sourceLink || null);\n      if (dupCheck.isDuplicate) {\n        return { success: false, isDuplicate: true, existingId: dupCheck.existingId, id: dupCheck.existingId || 0 };\n      }\n\n      const result = await db.insert(opportunities).values({'''
          if target not in s:
            raise SystemExit('legacy import insertion target not found')
          s = s.replace(target, repl, 1)

          # If bulk AI review is requested, actually run it for every successfully imported record.
          marker = '      // Update import run\n'
          block = '''      if (input.triggerAiReview && importedIds.length > 0) {\n        const { runOpportunityReview } = await import("./aiEngine");\n        for (const opportunityId of importedIds) {\n          try {\n            const [importedOpportunity] = await db.select().from(opportunities)\n              .where(and(eq(opportunities.id, opportunityId), eq(opportunities.workspaceId, wsId)))\n              .limit(1);\n            if (importedOpportunity) {\n              await runOpportunityReview(\n                { workspaceId: wsId, userId: ctx.user.id, recordType: "opportunity", recordId: opportunityId, runType: "opportunity_review" },\n                JSON.stringify(importedOpportunity)\n              );\n            }\n          } catch (err: any) {\n            console.error("[SAM Bulk Import] AI review failed for opportunity", opportunityId, err?.message || err);\n          }\n        }\n      }\n\n'''
          if marker not in s:
            raise SystemExit('bulk import update marker not found')
          s = s.replace(marker, block + marker, 1)

          helper_marker = '// ─── Helpers ─────────────────────────────────────────────────────────────────\n'
          helper = '''function resolveInsertId(result: unknown): number {\n  if (typeof result === "number") return result;\n  const anyResult = result as any;\n  return Number(anyResult?.[0]?.insertId ?? anyResult?.insertId ?? 0);\n}\n\n'''
          if helper_marker not in s:
            raise SystemExit('helper marker not found')
          s = s.replace(helper_marker, helper_marker + '\n' + helper, 1)
          p.write_text(s)
          PY

          cat > server/phase4SamFoundation.test.ts <<'EOF'
          import { describe, expect, it } from "vitest";
          import fs from "node:fs";
          import path from "node:path";

          describe("Phase 4 SAM intake foundation", () => {
            const source = fs.readFileSync(path.join(process.cwd(), "server/samRouter.ts"), "utf8");
            it("workspace-scopes resync and attachment dedupe", () => {
              expect(source).toContain("eq(opportunities.workspaceId, wsId)");
              expect(source).toContain("eq(opportunitySourceFiles.workspaceId, wsId)");
              expect(source).toContain("eq(opportunityImportRuns.workspaceId, wsId)");
            });
            it("applies duplicate protection to legacy import", () => {
              expect(source).toContain("const dupCheck = await checkForDuplicate(db, wsId, input.noticeId");
              expect(source).toContain("isDuplicate: true");
            });
            it("actually runs requested bulk AI review", () => {
              expect(source).toContain("if (input.triggerAiReview && importedIds.length > 0)");
              expect(source).toContain("await runOpportunityReview(");
            });
            it("normalizes insert ids", () => {
              expect(source).toContain("function resolveInsertId(result: unknown): number");
              expect(source).toContain("const opportunityId = resolveInsertId(insertResult)");
            });
          });
          EOF
      - name: Verify patch assertions
        run: |
          ! grep -F '.where(eq(opportunities.id, input.opportunityId));' server/samRouter.ts
          grep -q 'workspaceId, wsId' server/samRouter.ts
          grep -q 'triggerAiReview && importedIds.length' server/samRouter.ts
      - run: corepack enable && corepack prepare pnpm@10.4.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm drizzle-kit migrate
      - run: pnpm check
      - run: env -u RESEND_API_KEY pnpm test
      - run: pnpm build
      - name: Commit verified Phase 4 foundation without temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase4-sam-foundation.yml
          git add server/samRouter.ts server/phase4SamFoundation.test.ts
          git commit -m "fix(phase4): harden SAM opportunity intake foundation"
          git push origin HEAD:agent/phase4-opportunity-intake
