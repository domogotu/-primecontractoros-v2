name: Phase 1 tenancy audit

on:
  push:
    branches:
      - agent/v2-modernization-phase1
    paths:
      - .github/workflows/phase1-tenancy-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v2-modernization-phase1
          fetch-depth: 0
      - name: Scan tenant-sensitive router patterns
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files = list(Path('server').rglob('*.ts'))
          findings = []
          for p in files:
            text = p.read_text(errors='ignore')
            # Calls to child-record helpers known to take only IDs, useful candidates for manual review.
            for fn in [
              'getInvoiceStatusHistory','getPaymentLinksForInvoice','getContactLinksForRecord','listFileVersions',
              'createContactLink','linkPaymentToInvoice'
            ]:
              for m in re.finditer(rf'\b{fn}\s*\(([^\n;]*)', text):
                findings.append((str(p), text.count('\n',0,m.start())+1, fn, m.group(1).strip()[:160]))

          # Scan protected/admin route callbacks that explicitly omit ctx. These are candidates, not automatic vulnerabilities.
          callback_candidates = []
          for p in files:
            if 'Router' not in p.name and 'router' not in p.name.lower():
              continue
            lines = p.read_text(errors='ignore').splitlines()
            for i,line in enumerate(lines,1):
              if re.search(r'\.(query|mutation)\(async \(\{\s*input\s*\}\)', line):
                callback_candidates.append((str(p), i, line.strip()))

          out = [
            '# Phase 1 Security / Tenancy Static Audit', '',
            'This is a candidate inventory generated from the current modernization branch. A match is not automatically a defect; each candidate must be traced to its schema and parent ownership before remediation.', '',
            '## Known child-record helper call sites', '',
            '| File | Line | Helper | Arguments |', '|---|---:|---|---|'
          ]
          for p,line,fn,args in findings:
            out.append(f'| `{p}` | {line} | `{fn}` | `{args.replace("|","\\|")}` |')
          out += ['', '## Router callbacks accepting input without ctx', '', '| File | Line | Callback |', '|---|---:|---|']
          for p,line,code in callback_candidates:
            out.append(f'| `{p}` | {line} | `{code.replace("|","\\|")}` |')
          out += ['', '## Interpretation', '',
                  '- Global/platform reference data may legitimately omit workspace context.',
                  '- Tenant-owned or child records must be scoped directly by `workspaceId` or validated through a tenant-scoped parent before read/write.',
                  '- This report is an aid for source review; tests and schema tracing govern final classification.', '']
          Path('docs/SECURITY_TENANCY_AUDIT_PHASE1.md').write_text('\n'.join(out))
          PY
      - name: Commit audit inventory
        run: |
          rm -f .github/workflows/phase1-tenancy-audit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(security): record phase 1 tenancy audit candidates'
          git push origin HEAD:agent/v2-modernization-phase1
