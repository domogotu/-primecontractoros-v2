name: One-time AI approval idempotency hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Harden AI approval idempotency and scoped child reads
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('server/aiRouter.ts')
          t = p.read_text()

          # AI run/finding detail reads must scope child rows to the same workspace,
          # even when the parent run/finding itself has already been verified.
          t = t.replace(
              'const findings = await (await getDb())!.select().from(aiFindings).where(eq(aiFindings.aiRunId, input.runId));',
              'const findings = await (await getDb())!.select().from(aiFindings).where(and(eq(aiFindings.aiRunId, input.runId), eq(aiFindings.workspaceId, workspaceId)));',
              1,
          )
          t = t.replace(
              'const suggestions = await (await getDb())!.select().from(aiSuggestions).where(eq(aiSuggestions.aiRunId, input.runId));',
              'const suggestions = await (await getDb())!.select().from(aiSuggestions).where(and(eq(aiSuggestions.aiRunId, input.runId), eq(aiSuggestions.workspaceId, workspaceId)));',
              1,
          )
          t = t.replace(
              'const obligations = await (await getDb())!.select().from(aiExtractedObligations).where(eq(aiExtractedObligations.findingId, input.findingId));',
              'const obligations = await (await getDb())!.select().from(aiExtractedObligations).where(and(eq(aiExtractedObligations.findingId, input.findingId), eq(aiExtractedObligations.workspaceId, workspaceId)));',
              1,
          )

          # Before creating a live contract-linked object from an approved finding,
          # re-prove that any referenced contract belongs to the same workspace.
          anchor = '''  const description = finding.summary || finding.practicalMeaning || undefined;\n\n  try {\n'''
          replacement = '''  const description = finding.summary || finding.practicalMeaning || undefined;\n\n  if (contractId) {\n    const contract = await getContract(contractId, workspaceId);\n    if (!contract) {\n      console.error("convertFindingToLiveRecord blocked cross-workspace or missing contract", { findingId: finding.id, contractId, workspaceId });\n      return null;\n    }\n  }\n\n  try {\n'''
          if replacement not in t:
              if anchor not in t: raise SystemExit('finding conversion anchor not found')
              t = t.replace(anchor, replacement, 1)

          # Same defense for extracted obligations after resolving their parent finding.
          anchor = '''  } catch { /* contractId stays undefined */ }\n\n  try {\n'''
          replacement = '''  } catch { /* contractId stays undefined */ }\n\n  if (contractId) {\n    const contract = await getContract(contractId, workspaceId);\n    if (!contract) {\n      console.error("convertObligationToLiveRecord blocked cross-workspace or missing contract", { obligationId: obligation.id, contractId, workspaceId });\n      return null;\n    }\n  }\n\n  try {\n'''
          if replacement not in t:
              if anchor not in t: raise SystemExit('obligation conversion anchor not found')
              t = t.replace(anchor, replacement, 1)

          # Single finding approval must be idempotent: once a live object exists,
          # approving again returns/reuses it instead of creating a duplicate.
          old = '''          // Phase 1: Create the live downstream record\n          const result = await convertFindingToLiveRecord(finding, ctx.user.id);\n          if (result) {\n            createdRecordType = result.recordType;\n            createdRecordId = result.recordId;\n            updateData.approvedLiveObjectType = result.recordType;\n            updateData.approvedLiveObjectId = result.recordId;\n          }\n'''
          new = '''          // Create the live downstream record only once. Re-approval is idempotent.\n          if (finding.approvedLiveObjectId && finding.approvedLiveObjectType) {\n            createdRecordType = finding.approvedLiveObjectType;\n            createdRecordId = finding.approvedLiveObjectId;\n          } else {\n            const result = await convertFindingToLiveRecord(finding, ctx.user.id);\n            if (result) {\n              createdRecordType = result.recordType;\n              createdRecordId = result.recordId;\n              updateData.approvedLiveObjectType = result.recordType;\n              updateData.approvedLiveObjectId = result.recordId;\n            }\n          }\n'''
          if new not in t:
              if old not in t: raise SystemExit('single finding approval anchor not found')
              t = t.replace(old, new, 1)

          # Bulk finding approval gets the same idempotency rule.
          old = '''          // Phase 1: Create the live downstream record\n          const result = await convertFindingToLiveRecord(finding, ctx.user.id);\n          if (result) {\n            createdRecordType = result.recordType;\n            createdRecordId = result.recordId;\n            updateData.approvedLiveObjectType = result.recordType;\n            updateData.approvedLiveObjectId = result.recordId;\n          }\n\n          await db!.update(aiFindings).set(updateData).where(and(eq(aiFindings.id, id), eq(aiFindings.workspaceId, workspaceId)));\n'''
          new = '''          // Create the live downstream record only once. Bulk re-approval is idempotent.\n          if (finding.approvedLiveObjectId && finding.approvedLiveObjectType) {\n            createdRecordType = finding.approvedLiveObjectType;\n            createdRecordId = finding.approvedLiveObjectId;\n          } else {\n            const result = await convertFindingToLiveRecord(finding, ctx.user.id);\n            if (result) {\n              createdRecordType = result.recordType;\n              createdRecordId = result.recordId;\n              updateData.approvedLiveObjectType = result.recordType;\n              updateData.approvedLiveObjectId = result.recordId;\n            }\n          }\n\n          await db!.update(aiFindings).set(updateData).where(and(eq(aiFindings.id, id), eq(aiFindings.workspaceId, workspaceId)));\n'''
          if new not in t:
              if old not in t: raise SystemExit('bulk finding approval anchor not found')
              t = t.replace(old, new, 1)

          # Single obligation approval must reuse its previously-created live record.
          old = '''        // Phase 1: Create the live downstream record\n        const result = await convertObligationToLiveRecord(obligation, ctx.user.id);\n\n        const updateData: any = {\n          approvalState: "approved",\n          approvedBy: ctx.user.id,\n          approvedAt: new Date(),\n        };\n        if (result) {\n          updateData.createdRecordType = result.recordType;\n          updateData.createdRecordId = result.recordId;\n        }\n'''
          new = '''        // Create the live downstream record only once. Re-approval is idempotent.\n        const result = obligation.createdRecordId && obligation.createdRecordType\n          ? { recordType: obligation.createdRecordType, recordId: obligation.createdRecordId }\n          : await convertObligationToLiveRecord(obligation, ctx.user.id);\n\n        const updateData: any = {\n          approvalState: "approved",\n          approvedBy: ctx.user.id,\n          approvedAt: new Date(),\n        };\n        if (result && !obligation.createdRecordId) {\n          updateData.createdRecordType = result.recordType;\n          updateData.createdRecordId = result.recordId;\n        }\n'''
          if new not in t:
              if old not in t: raise SystemExit('single obligation approval anchor not found')
              t = t.replace(old, new, 1)

          # Bulk obligation approval also reuses an existing live record.
          old = '''          // Phase 1: Create the live downstream record\n          const result = await convertObligationToLiveRecord(obligation, ctx.user.id);\n\n          const updateData: any = { approvalState: "approved", approvedBy: ctx.user.id, approvedAt: new Date() };\n          if (result) {\n            updateData.createdRecordType = result.recordType;\n            updateData.createdRecordId = result.recordId;\n          }\n'''
          new = '''          // Create the live downstream record only once. Bulk re-approval is idempotent.\n          const result = obligation.createdRecordId && obligation.createdRecordType\n            ? { recordType: obligation.createdRecordType, recordId: obligation.createdRecordId }\n            : await convertObligationToLiveRecord(obligation, ctx.user.id);\n\n          const updateData: any = { approvalState: "approved", approvedBy: ctx.user.id, approvedAt: new Date() };\n          if (result && !obligation.createdRecordId) {\n            updateData.createdRecordType = result.recordType;\n            updateData.createdRecordId = result.recordId;\n          }\n'''
          if new not in t:
              if old not in t: raise SystemExit('bulk obligation approval anchor not found')
              t = t.replace(old, new, 1)

          p.write_text(t)

          required = [
              'eq(aiFindings.workspaceId, workspaceId)',
              'eq(aiSuggestions.workspaceId, workspaceId)',
              'eq(aiExtractedObligations.workspaceId, workspaceId)',
              'finding.approvedLiveObjectId && finding.approvedLiveObjectType',
              'obligation.createdRecordId && obligation.createdRecordType',
              'blocked cross-workspace or missing contract',
          ]
          current = p.read_text()
          missing = [x for x in required if x not in current]
          if missing: raise SystemExit('Missing AI approval hardening: ' + ', '.join(missing))
          PY

      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/aiRouter.ts
          if git diff --cached --quiet; then
            echo 'No changes required.'
          else
            git commit -m 'fix(ai): make approvals idempotent and scope child reads'
            git push origin HEAD:main
          fi
