name: One-time lessons linkable and stats repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix lesson stats and linkable record visibility
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('server/integrationsRouter.ts')
          text = path.read_text()

          old = '''      applied: all.filter(l => (l as any).lessonStatus === "applied" || l.appliedToTemplateId).length,\n'''
          new = '''      applied: all.filter(l => l.status === "applied" || l.appliedToTemplateId).length,\n'''
          if old not in text:
            raise SystemExit('Lessons applied stats anchor not found')
          text = text.replace(old, new, 1)

          old = '''          return (await db.select({ id: contracts.id, title: contracts.title }).from(contracts)\n            .where(eq(contracts.workspaceId, workspaceId))).map(r => ({ id: r.id, title: r.title }));\n'''
          new = '''          return (await db.select({ id: contracts.id, title: contracts.title }).from(contracts)\n            .where(and(eq(contracts.workspaceId, workspaceId), isNull(contracts.deletedAt)))).map(r => ({ id: r.id, title: r.title }));\n'''
          if old not in text:
            raise SystemExit('Contract linkable anchor not found')
          text = text.replace(old, new, 1)

          old = '''          return (await db.select({ id: proposals.id, title: proposals.title }).from(proposals)\n            .where(eq(proposals.workspaceId, workspaceId))).map(r => ({ id: r.id, title: r.title }));\n'''
          new = '''          return (await db.select({ id: proposals.id, title: proposals.title }).from(proposals)\n            .where(and(eq(proposals.workspaceId, workspaceId), isNull(proposals.deletedAt)))).map(r => ({ id: r.id, title: r.title }));\n'''
          if old not in text:
            raise SystemExit('Proposal linkable anchor not found')
          text = text.replace(old, new, 1)

          old = '''          return (await db.select({ id: opportunities.id, title: opportunities.title }).from(opportunities)\n            .where(eq(opportunities.workspaceId, workspaceId))).map(r => ({ id: r.id, title: r.title }));\n'''
          new = '''          return (await db.select({ id: opportunities.id, title: opportunities.title }).from(opportunities)\n            .where(and(eq(opportunities.workspaceId, workspaceId), isNull(opportunities.deletedAt)))).map(r => ({ id: r.id, title: r.title }));\n'''
          if old not in text:
            raise SystemExit('Opportunity linkable anchor not found')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/integrationsRouter.ts
          if git diff --cached --quiet; then
            echo 'No repair needed.'
          else
            git commit -m 'fix(lessons): correct applied stats and hide deleted link targets'
            git push origin HEAD:main
          fi
