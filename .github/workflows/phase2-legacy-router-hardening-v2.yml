name: Phase 2 legacy router hardening v2

on:
  push:
    branches:
      - agent/v2-modernization-phase2
    paths:
      - .github/workflows/phase2-legacy-router-hardening-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: primecontractoros_test
          MYSQL_USER: user
          MYSQL_PASSWORD: pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uuser -ppass"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: mysql://user:pass@127.0.0.1:3306/primecontractoros_test
      JWT_SECRET: phase2-validation-only-not-a-secret
      VITE_APP_ID: phase2-validation
      OAUTH_SERVER_URL: https://example.invalid
      VITE_OAUTH_PORTAL_URL: https://example.invalid
      OWNER_OPEN_ID: phase2-owner
      OWNER_NAME: Phase2 Owner
      OPENAI_API_KEY: sk-test-dummy-phase2-validation
      SAM_GOV_API_KEY: phase2-test
      STRIPE_SECRET_KEY: sk_test_phase2_validation
      STRIPE_PUBLISHABLE_KEY: pk_test_phase2_validation
      STRIPE_WEBHOOK_SECRET: whsec_phase2_validation
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v2-modernization-phase2
          fetch-depth: 0
      - name: Apply hardening
        run: python scripts/phase2_legacy_harden.py
      - run: corepack enable && corepack prepare pnpm@10.4.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm drizzle-kit migrate
      - run: pnpm check
      - run: env -u RESEND_API_KEY pnpm test
      - run: pnpm build
      - name: Commit verified hardening
        run: |
          rm -f .github/workflows/phase2-legacy-router-hardening.yml
          rm -f .github/workflows/phase2-legacy-router-hardening-v2.yml
          rm -f scripts/phase2_legacy_harden.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(phase2): harden legacy routers for tenancy and current schema'
          git push origin HEAD:agent/v2-modernization-phase2
