name: One-time contract lifecycle transition repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce contract lifecycle transitions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('server/routers.ts')
          text = path.read_text()

          old = '''          const { wsId } = await enforcePermission(ctx.user.id, "write");\n          // Get current contract to capture previous status\n          const contract = await getContract(input.id, wsId);\n          const previousStatus = contract?.status || "unknown";\n          await updateContractStatus(input.id, wsId, input.status);\n'''

          new = '''          const { wsId } = await enforcePermission(ctx.user.id, "write");\n          // Contract lifecycle changes are protected server-side so API callers cannot skip required stages.\n          const contract = await getContract(input.id, wsId);\n          if (!contract) {\n            throw new TRPCError({ code: "NOT_FOUND", message: "Contract not found." });\n          }\n          const previousStatus = contract.status || "setup";\n          const allowedTransitions: Record<string, string[]> = {\n            setup: ["active", "suspended"],\n            active: ["modification", "closeout", "suspended"],\n            modification: ["active", "closeout", "suspended"],\n            suspended: ["active", "closeout"],\n            closeout: ["active", "closed"],\n            closed: [],\n          };\n          if (input.status !== previousStatus && !(allowedTransitions[previousStatus] || []).includes(input.status)) {\n            throw new TRPCError({\n              code: "PRECONDITION_FAILED",\n              message: `Invalid contract status transition: ${previousStatus} → ${input.status}. Follow the contract lifecycle instead of skipping stages.`,\n            });\n          }\n\n          // A contract cannot be marked Closed until its closeout record has passed all required-item/blocker checks.\n          if (input.status === "closed" && previousStatus !== "closed") {\n            const db2 = await getDb();\n            if (!db2) throw new TRPCError({ code: "INTERNAL_SERVER_ERROR", message: "Database not available." });\n            const { closeoutRecords } = await import("../drizzle/schema");\n            const { and: andStatus, eq: eqStatus } = await import("drizzle-orm");\n            const [closeout] = await db2.select({ status: closeoutRecords.status }).from(closeoutRecords).where(andStatus(\n              eqStatus(closeoutRecords.workspaceId, wsId),\n              eqStatus(closeoutRecords.contractId, input.id),\n            )).limit(1);\n            if (!closeout || closeout.status !== "completed") {\n              throw new TRPCError({\n                code: "PRECONDITION_FAILED",\n                message: "Complete the contract closeout checklist and resolve or waive all closeout blockers before marking this contract Closed.",\n              });\n            }\n          }\n\n          await updateContractStatus(input.id, wsId, input.status);\n'''

          if old not in text:
              raise SystemExit('Expected contract updateStatus anchor was not found; refusing to modify the file.')

          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/routers.ts
          if git diff --cached --quiet; then
            echo 'No repair needed.'
          else
            git commit -m 'fix(contracts): enforce lifecycle status transitions'
            git push origin HEAD:main
          fi
