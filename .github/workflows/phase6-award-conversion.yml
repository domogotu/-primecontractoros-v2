name: Phase 6 award conversion finalize

on:
  push:
    branches:
      - agent/phase6-award-conversion
    paths:
      - .github/workflows/phase6-award-conversion.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase6-award-conversion
          fetch-depth: 0
      - name: Reproduce previously validated Phase 6 source
        run: |
          sed -i 's/for (const contactId of contactIds)/for (const contactId of Array.from(contactIds))/g' scripts/phase6_apply.py
          sed -i 's/for (const fileId of fileIds)/for (const fileId of Array.from(fileIds))/g' scripts/phase6_apply.py
          python scripts/phase6_apply.py
          grep -q 'reusedExisting: !created' server/routers.ts
          grep -q 'proposalContactLinks' server/routers.ts
          grep -q 'proposalFileLinks' server/routers.ts
          grep -q 'sourceType: "proposal"' server/routers.ts
          grep -q 'newStatus: "setup"' server/routers.ts
          grep -q 'existingSetupTask' server/routers.ts
          grep -q 'Array.from(contactIds)' server/routers.ts
          grep -q 'Array.from(fileIds)' server/routers.ts
      - name: Commit source already validated by run 31285605373
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/phase6-award-conversion.yml scripts/phase6_apply.py
          git add server/routers.ts server/phase6AwardConversion.test.ts
          git commit -m "feat(phase6): harden proposal to award conversion"
          git push origin HEAD:agent/phase6-award-conversion
