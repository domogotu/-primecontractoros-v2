name: One-time proposal status consistency repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair proposal status lifecycle consistency
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('client/src/pages/ProposalDetail.tsx')
          text = path.read_text()

          old_mutations = """  const updateStatusMutation = trpc.proposals.updateStatus.useMutation();\n  const convertToContractMutation = trpc.proposals.convertToContract.useMutation();\n\n"""
          new_mutations = """  const utils = trpc.useUtils();\n  const updateStatusMutation = trpc.proposals.updateStatus.useMutation({\n    onSuccess: async () => {\n      await Promise.all([\n        utils.proposals.get.invalidate({ id: proposalId! }),\n        utils.proposals.list.invalidate(),\n      ]);\n    },\n  });\n  const convertToContractMutation = trpc.proposals.convertToContract.useMutation();\n\n"""

          old_statuses = """                {['draft', 'in_progress', 'submitted'].map(s => (\n"""
          new_statuses = """                {['draft', 'in_progress', 'under_review', 'submitted'].map(s => (\n"""

          if old_mutations not in text:
              raise SystemExit('Expected ProposalDetail mutation block was not found; refusing to modify the file.')
          if old_statuses not in text:
              raise SystemExit('Expected ProposalDetail status button block was not found; refusing to modify the file.')

          text = text.replace(old_mutations, new_mutations, 1)
          text = text.replace(old_statuses, new_statuses, 1)
          path.write_text(text)
          PY

      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/src/pages/ProposalDetail.tsx
          if git diff --cached --quiet; then
            echo 'No repair needed.'
          else
            git commit -m 'fix(proposals): keep status lifecycle and UI state consistent'
            git push origin HEAD:main
          fi
