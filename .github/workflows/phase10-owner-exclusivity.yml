name: Phase 10 owner exclusivity
on:
  push:
    branches: [agent/phase10-auth-dependency-readiness]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: primecontractoros_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/primecontractoros_test
      JWT_SECRET: phase10-owner-validation-secret-1234567890
      NODE_ENV: test
      OWNER_EMAIL: dominiquereed35@gmail.com
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Restrict platform admin router to owner procedure
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('server/platformAdminRouter.ts')
          s=p.read_text()
          s=s.replace('import { adminProcedure, router } from "./_core/trpc";', 'import { router } from "./_core/trpc";\nimport { platformOwnerProcedure } from "./_core/platformOwnerProcedure";')
          s=s.replace('adminProcedure', 'platformOwnerProcedure')
          p.write_text(s)
          PY
      - name: Verify owner exclusivity markers
        run: |
          grep -q 'platformOwnerProcedure' server/platformAdminRouter.ts
          ! grep -q 'adminProcedure' server/platformAdminRouter.ts
          grep -q 'dominiquereed35@gmail.com' server/_core/env.ts
          grep -q 'OWNER_EMAIL' render.yaml
      - run: corepack enable && corepack prepare pnpm@10.4.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm drizzle-kit migrate
      - run: pnpm check
      - run: env -u RESEND_API_KEY pnpm test
      - run: pnpm build
      - name: Commit verified owner access change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/platformAdminRouter.ts server/_core/platformOwnerProcedure.ts server/_core/env.ts render.yaml
          git commit -m 'feat(auth): restrict platform controls to canonical owner' || true
          git push
