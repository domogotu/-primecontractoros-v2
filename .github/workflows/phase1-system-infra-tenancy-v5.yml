name: Phase 1 system infrastructure tenancy v5

on:
  push:
    branches:
      - agent/v2-modernization-phase1
    paths:
      - .github/workflows/phase1-system-infra-tenancy-v5.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: primecontractoros_test
          MYSQL_USER: user
          MYSQL_PASSWORD: pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uuser -ppass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql://user:pass@127.0.0.1:3306/primecontractoros_test
      JWT_SECRET: phase1-validation-only-not-a-secret
      VITE_APP_ID: phase1-validation
      OAUTH_SERVER_URL: https://example.invalid
      VITE_OAUTH_PORTAL_URL: https://example.invalid
      OWNER_OPEN_ID: phase1-owner
      OWNER_NAME: Phase1 Owner
      OPENAI_API_KEY: sk-test-dummy-phase1-validation
      SAM_GOV_API_KEY: phase1-test
      STRIPE_SECRET_KEY: sk_test_phase1_validation
      STRIPE_PUBLISHABLE_KEY: pk_test_phase1_validation
      STRIPE_WEBHOOK_SECRET: whsec_phase1_validation
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v2-modernization-phase1
          fetch-depth: 0

      - name: Apply uniform active-workspace guard
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('server/systemInfraRouter.ts')
          s=p.read_text()
          if 'import { TRPCError } from "@trpc/server";' not in s:
            s=s.replace('import { router, protectedProcedure } from "./_core/trpc";','import { router, protectedProcedure } from "./_core/trpc";\nimport { TRPCError } from "@trpc/server";\nimport { requireWorkspaceId } from "./workspaceMiddleware";',1)
          if 'async function requireActiveWorkspace' not in s:
            s=s.replace('export const systemInfraRouter = router({','''async function requireActiveWorkspace(ctx: any, requestedWorkspaceId?: number): Promise<number> {
            if (!ctx.user?.id) throw new TRPCError({ code: "UNAUTHORIZED" });
            const workspaceId = await requireWorkspaceId(ctx.user.id);
            if (requestedWorkspaceId !== undefined && requestedWorkspaceId !== workspaceId) {
              throw new TRPCError({ code: "FORBIDDEN", message: "Workspace access denied" });
            }
            return workspaceId;
          }

          async function requireSupportTicketInWorkspace(ticketId: number, workspaceId: number) {
            const db = await getDb();
            if (!db) throw new Error("Database not available");
            const [ticket] = await db.select().from(supportTickets)
              .where(and(eq(supportTickets.id, ticketId), eq(supportTickets.workspaceId, workspaceId)))
              .limit(1);
            if (!ticket) throw new TRPCError({ code: "NOT_FOUND", message: "Support ticket not found" });
            return ticket;
          }

          export const systemInfraRouter = router({''',1)

          # Every callback that accepts input resolves the active workspace and rejects a mismatched workspaceId when supplied.
          s=s.replace('.query(async ({ input }) => {','.query(async ({ ctx, input }) => {')
          s=s.replace('.mutation(async ({ input }) => {','.mutation(async ({ ctx, input }) => {')
          lines=s.splitlines()
          out=[]
          for line in lines:
            out.append(line)
            if '.query(async ({ ctx, input }) => {' in line or '.mutation(async ({ ctx, input }) => {' in line:
              indent=line[:len(line)-len(line.lstrip())]+'  '
              out.append(indent+'await requireActiveWorkspace(ctx, (input as any)?.workspaceId);')
          s='\n'.join(out)+'\n'

          # ID-only notification writes need a workspace predicate in addition to the uniform guard.
          old='await db.update(notifications).set({ isRead: true }).where(eq(notifications.id, input.notificationId));'
          if old not in s: raise SystemExit('markRead update missing')
          s=s.replace(old,'const tenantWorkspaceId = await requireActiveWorkspace(ctx);\n        await db.update(notifications).set({ isRead: true }).where(and(eq(notifications.id, input.notificationId), eq(notifications.workspaceId, tenantWorkspaceId)));',1)
          old='await db.update(notifications).set({ dismissedAt: new Date() }).where(eq(notifications.id, input.notificationId));'
          if old not in s: raise SystemExit('dismiss update missing')
          s=s.replace(old,'const tenantWorkspaceId = await requireActiveWorkspace(ctx);\n        await db.update(notifications).set({ dismissedAt: new Date() }).where(and(eq(notifications.id, input.notificationId), eq(notifications.workspaceId, tenantWorkspaceId)));',1)

          # Support list is always tenant scoped, even when workspaceId is omitted.
          old='''        const conditions: any[] = [];
        if (input?.workspaceId) conditions.push(eq(supportTickets.workspaceId, input.workspaceId));'''
          if old not in s: raise SystemExit('support list lines missing')
          s=s.replace(old,'''        const tenantWorkspaceId = await requireActiveWorkspace(ctx, input?.workspaceId);
        const conditions: any[] = [eq(supportTickets.workspaceId, tenantWorkspaceId)];''',1)

          # Support status update and notes must validate the ticket's tenant parent.
          marker='const updateData: any = { status: input.status };'
          pos=s.rfind(marker)
          if pos < 0: raise SystemExit('support update marker missing')
          s=s[:pos]+'const tenantWorkspaceId = await requireActiveWorkspace(ctx);\n        await requireSupportTicketInWorkspace(input.id, tenantWorkspaceId);\n        '+s[pos:]
          old='await db.update(supportTickets).set(updateData).where(eq(supportTickets.id, input.id));'
          if old not in s: raise SystemExit('support update write missing')
          s=s.replace(old,'await db.update(supportTickets).set(updateData).where(and(eq(supportTickets.id, input.id), eq(supportTickets.workspaceId, tenantWorkspaceId)));',1)

          old='''      .mutation(async ({ ctx, input }) => {
        await requireActiveWorkspace(ctx, (input as any)?.workspaceId);
        await logAuditEvent({
          workspaceId: 0,'''
          if old not in s: raise SystemExit('support note start missing')
          s=s.replace(old,'''      .mutation(async ({ ctx, input }) => {
        await requireActiveWorkspace(ctx, (input as any)?.workspaceId);
        const tenantWorkspaceId = await requireActiveWorkspace(ctx);
        await requireSupportTicketInWorkspace(input.ticketId, tenantWorkspaceId);
        await logAuditEvent({
          workspaceId: tenantWorkspaceId,''',1)

          for item in ['Workspace access denied','eq(notifications.workspaceId, tenantWorkspaceId)','eq(supportTickets.workspaceId, tenantWorkspaceId)','requireSupportTicketInWorkspace(input.id, tenantWorkspaceId)','requireSupportTicketInWorkspace(input.ticketId, tenantWorkspaceId)']:
            if item not in s: raise SystemExit('missing invariant '+item)
          p.write_text(s)
          PY

      - name: Add regression coverage
        run: |
          cat > server/systemInfraTenancy.test.ts <<'EOF'
          import { describe, expect, it } from "vitest";
          import { readFileSync } from "node:fs";
          import { fileURLToPath } from "node:url";
          import { dirname, join } from "node:path";
          const here=dirname(fileURLToPath(import.meta.url));
          const source=readFileSync(join(here,"systemInfraRouter.ts"),"utf8");
          describe("system infrastructure tenant isolation",()=>{
            it("guards every input-bearing route with the active workspace",()=>{
              expect(source).toContain("requireWorkspaceId(ctx.user.id)");
              expect(source).toContain("Workspace access denied");
              expect(source.match(/requireActiveWorkspace\(ctx, \(input as any\)\?\.workspaceId\)/g)?.length || 0).toBeGreaterThan(10);
            });
            it("scopes notification mutations by tenant",()=>{
              expect(source).toContain("eq(notifications.workspaceId, tenantWorkspaceId)");
            });
            it("scopes support list and validates ticket parent ownership",()=>{
              expect(source).toContain("eq(supportTickets.workspaceId, tenantWorkspaceId)");
              expect(source).toContain("requireSupportTicketInWorkspace(input.id, tenantWorkspaceId)");
              expect(source).toContain("requireSupportTicketInWorkspace(input.ticketId, tenantWorkspaceId)");
              expect(source.slice(source.indexOf("support: router({")).includes("workspaceId: 0")).toBe(false);
            });
          });
          EOF

      - run: corepack enable && corepack prepare pnpm@10.4.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm drizzle-kit migrate
      - run: pnpm check
      - run: env -u RESEND_API_KEY pnpm test
      - run: pnpm build
      - name: Commit verified hardening
        run: |
          rm -f .github/workflows/phase1-system-infra-tenancy-v5.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(security): enforce system infrastructure workspace isolation'
          git push origin HEAD:agent/v2-modernization-phase1
