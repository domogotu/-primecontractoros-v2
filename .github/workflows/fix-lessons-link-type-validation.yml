name: One-time lessons link type validation repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restrict lessons linked record types
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('server/integrationsRouter.ts')
          text = path.read_text()
          start = text.index('// ===== LESSONS LEARNED ROUTER =====')
          end = text.index('// ===== CAPABILITY STATEMENT ROUTER =====')
          section = text[start:end]

          section_new = section.replace(
              'linkedRecordType: z.string().optional(),',
              'linkedRecordType: z.enum(["contract", "proposal", "opportunity"]).optional(),'
          )

          if section_new == section:
            raise SystemExit('No lessons linkedRecordType anchors found')

          old = '''      if (input.contractId) {\n'''
          new = '''      if ((input.linkedRecordType && !input.linkedRecordId) || (!input.linkedRecordType && input.linkedRecordId)) {\n        throw new Error("Linked record type and linked record ID must be provided together.");\n      }\n\n      if (input.contractId) {\n'''
          if old not in section_new:
            raise SystemExit('Lessons create validation anchor not found')
          section_new = section_new.replace(old, new, 1)

          text = text[:start] + section_new + text[end:]
          path.write_text(text)
          PY

      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/integrationsRouter.ts
          if git diff --cached --quiet; then
            echo 'No repair needed.'
          else
            git commit -m 'fix(lessons): restrict linked record types and require complete links'
            git push origin HEAD:main
          fi
