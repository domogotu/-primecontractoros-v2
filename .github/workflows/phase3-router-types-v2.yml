name: Phase 3 router type hardening v2
on:
  push:
    branches: [agent/v2-modernization-phase3]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: primecontractoros_test
          MYSQL_USER: user
          MYSQL_PASSWORD: pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uuser -ppass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql://user:pass@127.0.0.1:3306/primecontractoros_test
      JWT_SECRET: phase3-validation-only-not-a-secret
      VITE_APP_ID: phase3-validation
      OAUTH_SERVER_URL: https://example.invalid
      VITE_OAUTH_PORTAL_URL: https://example.invalid
      OWNER_OPEN_ID: phase3-owner
      OWNER_NAME: Phase3 Owner
      OPENAI_API_KEY: sk-test-dummy-phase3-validation
      SAM_GOV_API_KEY: phase3-test
      STRIPE_SECRET_KEY: sk_test_phase3_validation
      STRIPE_PUBLISHABLE_KEY: pk_test_phase3_validation
      STRIPE_WEBHOOK_SECRET: whsec_phase3-validation
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v2-modernization-phase3
          fetch-depth: 0
      - name: Repair central router schema mismatches
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('server/routers.ts')
          s = p.read_text()
          if s.startswith('// @ts-nocheck\n'):
              s = s[len('// @ts-nocheck\n'):]

          s = s.replace(
            'const proposalId = await createProposal({\n            workspaceId: wsId,\n            title: input.proposalTitle,\n            opportunityId: input.opportunityId,\n            framework: input.framework,\n            dueDate: opportunity.dueDate || undefined,\n          });',
            'const proposalResult = await createProposal({\n            workspaceId: wsId,\n            title: input.proposalTitle,\n            opportunityId: input.opportunityId,\n            framework: input.framework,\n            dueDate: opportunity.dueDate || undefined,\n          });\n          const proposalId = Number((proposalResult as any)?.[0]?.insertId ?? (proposalResult as any)?.insertId);\n          if (!proposalId) throw new Error("Proposal creation did not return an insert id");'
          )
          s = s.replace('linkedRecordType: "proposal", linkedRecordId: proposalId', 'recordType: "proposal", recordId: proposalId')
          s = s.replace('linkedRecordType: "contract", linkedRecordId: contractId', 'recordType: "contract", recordId: contractId')
          s = s.replace('fileId: f.id, recordType: "proposal", recordId: proposalId', 'fileId: f.id, targetType: "proposal", targetId: proposalId')
          s = s.replace('fileId: f.id, recordType: "contract", recordId: contractId', 'fileId: f.id, targetType: "contract", targetId: contractId')
          # Restore note/task fields accidentally touched by broad record-link substitutions.
          s = s.replace('title: n.title, content: n.content, recordType: "proposal", recordId: proposalId, authorId:', 'title: n.title, content: n.content, linkedRecordType: "proposal", linkedRecordId: proposalId, authorId:')
          s = s.replace('title: n.title, content: n.content, recordType: "contract", recordId: contractId, authorId:', 'title: n.title, content: n.content, linkedRecordType: "contract", linkedRecordId: contractId, authorId:')
          s = s.replace('assignedTo: t.assignedTo, recordType: "proposal", recordId: proposalId, priority:', 'assignedTo: t.assignedTo, linkedRecordType: "proposal", linkedRecordId: proposalId, priority:')
          s = s.replace('assignedTo: t.assignedTo, recordType: "contract", recordId: contractId, priority:', 'assignedTo: t.assignedTo, linkedRecordType: "contract", linkedRecordId: contractId, priority:')
          s = s.replace('eqOp(tasksTbl.status, "open")', 'eqOp(tasksTbl.status, "todo")')

          s = s.replace(
            'const contractId = await createContract({\n            workspaceId: wsId,\n            title: input.contractTitle,\n            proposalId: input.proposalId,\n            contractNumber: input.contractNumber || undefined,\n          });',
            'const contractResult = await createContract({\n            workspaceId: wsId,\n            title: input.contractTitle,\n            proposalId: input.proposalId,\n            contractNumber: input.contractNumber || undefined,\n          });\n          const contractId = Number((contractResult as any)?.[0]?.insertId ?? (contractResult as any)?.insertId);\n          if (!contractId) throw new Error("Contract creation did not return an insert id");'
          )

          # The current deliverables schema is contract-only; remove the impossible proposal-linked copy block.
          old = '''          if (cf.deliverables) {\n            const linked = await db.select().from(deliverablesTbl).where(andOp(eqOp(deliverablesTbl.workspaceId, wsId), eqOp(deliverablesTbl.linkedRecordType, "proposal"), eqOp(deliverablesTbl.linkedRecordId, input.proposalId)));\n            for (const d of linked) {\n              await db.insert(deliverablesTbl).values({ workspaceId: wsId, title: d.title, description: d.description, linkedRecordType: "contract", linkedRecordId: contractId, dueDate: d.dueDate, status: "pending" });\n            }\n          }\n'''
          s = s.replace(old, '')
          s = s.replace('deliverables: z.boolean().default(true),', 'deliverables: z.boolean().default(false),')
          s = s.replace('{ contacts: true, files: true, notes: true, tasks: false, deliverables: true }', '{ contacts: true, files: true, notes: true, tasks: false, deliverables: false }')
          s = s.replace('contacts: contactsTbl, files: filesTbl, notes: notesTbl, tasks: tasksTbl, deliverables: deliverablesTbl, contactLinks, fileLinks', 'contacts: contactsTbl, files: filesTbl, notes: notesTbl, tasks: tasksTbl, contactLinks, fileLinks')

          s = s.replace('try { await logAudit(workspaceId, ctx.user.id, "update", "legal", 0, input); } catch {}', 'if (workspaceId) { try { await logAudit(workspaceId, userId, "update", "legal", 0, input); } catch {} }')

          p.write_text(s)
          PY
      - run: corepack enable && corepack prepare pnpm@10.4.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm drizzle-kit migrate
      - run: pnpm check
      - run: env -u RESEND_API_KEY pnpm test
      - run: pnpm build
      - name: Commit verified router hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/routers.ts
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix(phase3): align lifecycle router with current schema"
            git push origin HEAD:agent/v2-modernization-phase3
          fi
