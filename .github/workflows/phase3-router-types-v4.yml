name: Phase 3 router type hardening v4

on:
  push:
    branches: [agent/v2-modernization-phase3]
    paths: [.github/workflows/phase3-router-types-v4.yml]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: primecontractoros_test
          MYSQL_USER: user
          MYSQL_PASSWORD: pass
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uuser -ppass"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: mysql://user:pass@127.0.0.1:3306/primecontractoros_test
      JWT_SECRET: phase3-validation-only-not-a-secret
      VITE_APP_ID: phase3-validation
      OAUTH_SERVER_URL: https://example.invalid
      VITE_OAUTH_PORTAL_URL: https://example.invalid
      OWNER_OPEN_ID: phase3-owner
      OWNER_NAME: Phase3 Owner
      OPENAI_API_KEY: sk-test-dummy-phase3-validation
      SAM_GOV_API_KEY: phase3-test
      STRIPE_SECRET_KEY: sk_test_phase3_validation
      STRIPE_PUBLISHABLE_KEY: pk_test_phase3_validation
      STRIPE_WEBHOOK_SECRET: whsec_phase3-validation
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v2-modernization-phase3
          fetch-depth: 0
      - name: Fix lifecycle insert-id handling and current link schema
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('server/routers.ts')
          s=p.read_text()
          if s.startswith('// @ts-nocheck\n'):
              s=s[len('// @ts-nocheck\n'):]

          # Convert the first Opportunity -> Proposal creation to a numeric insert id.
          pat=r'(\s*)const proposalId = await createProposal\(\{(.*?)\n\1\}\);'
          def rp(m):
              ind=m.group(1); body=m.group(2)
              return f'{ind}const proposalResult = await createProposal({{{body}\n{ind}}});\n{ind}const proposalId = Number((proposalResult as any)?.[0]?.insertId ?? (proposalResult as any)?.insertId);\n{ind}if (!proposalId) throw new Error("Proposal creation did not return an insert id");'
          s,n=re.subn(pat,rp,s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit('proposal creation replacement failed')

          # Convert the first Proposal -> Contract creation to a numeric insert id.
          pat=r'(\s*)const contractId = await createContract\(\{(.*?)\n\1\}\);'
          def rc(m):
              ind=m.group(1); body=m.group(2)
              return f'{ind}const contractResult = await createContract({{{body}\n{ind}}});\n{ind}const contractId = Number((contractResult as any)?.[0]?.insertId ?? (contractResult as any)?.insertId);\n{ind}if (!contractId) throw new Error("Contract creation did not return an insert id");'
          s,n=re.subn(pat,rc,s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit('contract creation replacement failed')

          # Current many-to-many link schemas.
          s=s.replace('contactId: c.id, linkedRecordType: "proposal", linkedRecordId: proposalId, workspaceId: wsId',
                      'contactId: c.id, recordType: "proposal", recordId: proposalId, workspaceId: wsId')
          s=s.replace('contactId: c.id, linkedRecordType: "contract", linkedRecordId: contractId, workspaceId: wsId',
                      'contactId: c.id, recordType: "contract", recordId: contractId, workspaceId: wsId')
          s=s.replace('fileId: f.id, linkedRecordType: "proposal", linkedRecordId: proposalId, workspaceId: wsId',
                      'fileId: f.id, targetType: "proposal", targetId: proposalId, linkType: "carry_forward", workspaceId: wsId')
          s=s.replace('fileId: f.id, linkedRecordType: "contract", linkedRecordId: contractId, workspaceId: wsId',
                      'fileId: f.id, targetType: "contract", targetId: contractId, linkType: "carry_forward", workspaceId: wsId')
          s=s.replace('eqOp(tasksTbl.status, "open")','eqOp(tasksTbl.status, "todo")')

          # Current deliverables schema is contract-specific, not generic record-linked.
          s=re.sub(r'\n\s*if \(cf\.deliverables\) \{.*?\n\s*\}\n\s*await updateProposalStatus',
                   '\n          await updateProposalStatus',s,count=1,flags=re.S)
          s=s.replace('deliverables: z.boolean().default(true),','deliverables: z.boolean().default(false),')
          s=s.replace('{ contacts: true, files: true, notes: true, tasks: false, deliverables: true }',
                      '{ contacts: true, files: true, notes: true, tasks: false, deliverables: false }')
          s=s.replace('contacts: contactsTbl, files: filesTbl, notes: notesTbl, tasks: tasksTbl, deliverables: deliverablesTbl, contactLinks, fileLinks',
                      'contacts: contactsTbl, files: filesTbl, notes: notesTbl, tasks: tasksTbl, contactLinks, fileLinks')

          # Legal consent can occur pre-workspace.
          s=s.replace('try { await logAudit(workspaceId, ctx.user.id, "update", "legal", 0, input); } catch {}',
                      'if (workspaceId) { try { await logAudit(workspaceId, userId, "update", "legal", 0, input); } catch {} }')
          p.write_text(s)
          PY
      - name: Assert lifecycle router is using numeric IDs and current schemas
        run: |
          grep -n 'const proposalId = Number' server/routers.ts
          grep -n 'const contractId = Number' server/routers.ts
          ! head -n 1 server/routers.ts | grep '@ts-nocheck'
          ! grep -n 'tasksTbl.status, "open"' server/routers.ts
          ! grep -n 'deliverablesTbl.linkedRecordType\|deliverablesTbl.linkedRecordId' server/routers.ts
      - run: corepack enable && corepack prepare pnpm@10.4.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm drizzle-kit migrate
      - run: pnpm check
      - run: env -u RESEND_API_KEY pnpm test
      - run: pnpm build
      - name: Commit verified central router hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/routers.ts
          if ! git diff --cached --quiet; then
            git commit -m 'fix(phase3): harden central lifecycle router'
            git push origin HEAD:agent/v2-modernization-phase3
          fi
