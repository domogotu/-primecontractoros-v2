name: Phase 3 persisted help router
on:
  push:
    branches: [agent/v2-modernization-phase3]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: primecontractoros_test
          MYSQL_USER: user
          MYSQL_PASSWORD: pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uuser -ppass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql://user:pass@127.0.0.1:3306/primecontractoros_test
      JWT_SECRET: phase3-validation-only-not-a-secret
      VITE_APP_ID: phase3-validation
      OAUTH_SERVER_URL: https://example.invalid
      VITE_OAUTH_PORTAL_URL: https://example.invalid
      OWNER_OPEN_ID: phase3-owner
      OWNER_NAME: Phase3 Owner
      OPENAI_API_KEY: sk-test-dummy-phase3-validation
      SAM_GOV_API_KEY: phase3-test
      STRIPE_SECRET_KEY: sk_test_phase3_validation
      STRIPE_PUBLISHABLE_KEY: pk_test_phase3_validation
      STRIPE_WEBHOOK_SECRET: whsec_phase3_validation
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v2-modernization-phase3
          fetch-depth: 0
      - name: Replace placeholder help router with persisted help articles
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('server/batch1Router.ts')
          s = p.read_text()
          s = s.replace(
              'import { onboardingProgress, recordNotes, recordTimeline } from "../drizzle/schema";',
              'import { onboardingProgress, recordNotes, recordTimeline, helpArticles } from "../drizzle/schema";'
          )
          old = '''export const helpRouter = router({\n  getContent: protectedProcedure.input(z.object({ contextKey: z.string() })).query(async ({ input }) => ({ title: "Help", content: "Help content for: " + input.contextKey, contextKey: input.contextKey })),\n  list: protectedProcedure.query(async () => [{ id: 1, title: "Getting Started", contextKey: "getting-started", content: "Welcome to PrimeContractorOS" }]),\n});'''
          new = '''export const helpRouter = router({\n  getContent: protectedProcedure\n    .input(z.object({ contextKey: z.string() }))\n    .query(async ({ input }) => {\n      const db = await getDb();\n      if (!db) throw new Error("Database not available");\n      const [article] = await db\n        .select()\n        .from(helpArticles)\n        .where(and(eq(helpArticles.slug, input.contextKey), eq(helpArticles.isPublished, true)))\n        .limit(1);\n      if (!article) return null;\n      return {\n        id: article.id,\n        title: article.title,\n        content: article.body,\n        contextKey: article.slug,\n        category: article.category,\n        relatedGlossaryTerms: article.relatedGlossaryTerms,\n        updatedAt: article.updatedAt,\n      };\n    }),\n  list: protectedProcedure.query(async () => {\n    const db = await getDb();\n    if (!db) throw new Error("Database not available");\n    const articles = await db\n      .select()\n      .from(helpArticles)\n      .where(eq(helpArticles.isPublished, true))\n      .orderBy(helpArticles.title);\n    return articles.map((article) => ({\n      id: article.id,\n      title: article.title,\n      contextKey: article.slug,\n      content: article.body,\n      category: article.category,\n      relatedGlossaryTerms: article.relatedGlossaryTerms,\n      updatedAt: article.updatedAt,\n    }));\n  }),\n});'''
          if old not in s:
              raise SystemExit('legacy help router target not found')
          s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Verify fake help content is gone
        run: |
          ! grep -R "Help content for:" server/batch1Router.ts
          ! grep -R "Welcome to PrimeContractorOS" server/batch1Router.ts
          grep -q "from(helpArticles)" server/batch1Router.ts
      - run: corepack enable && corepack prepare pnpm@10.4.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm drizzle-kit migrate
      - run: pnpm check
      - run: env -u RESEND_API_KEY pnpm test
      - run: pnpm build
      - name: Commit verified persisted help router
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/batch1Router.ts
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix(phase3): replace placeholder help with persisted articles"
            git push origin HEAD:agent/v2-modernization-phase3
          fi