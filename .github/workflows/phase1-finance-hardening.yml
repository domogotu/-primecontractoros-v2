name: Phase 1 finance hardening

on:
  push:
    branches:
      - agent/v2-modernization-phase1
    paths:
      - .github/workflows/phase1-finance-hardening.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: primecontractoros_test
          MYSQL_USER: user
          MYSQL_PASSWORD: pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uuser -ppass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql://user:pass@127.0.0.1:3306/primecontractoros_test
      JWT_SECRET: phase1-validation-only-not-a-secret
      VITE_APP_ID: phase1-validation
      OAUTH_SERVER_URL: https://example.invalid
      VITE_OAUTH_PORTAL_URL: https://example.invalid
      OWNER_OPEN_ID: phase1-owner
      OWNER_NAME: Phase1 Owner
      OPENAI_API_KEY: sk-test-dummy-phase1-validation
      SAM_GOV_API_KEY: phase1-test
      STRIPE_SECRET_KEY: sk_test_phase1_validation
      STRIPE_PUBLISHABLE_KEY: pk_test_phase1_validation
      STRIPE_WEBHOOK_SECRET: whsec_phase1_validation
    steps:
      - name: Checkout modernization branch
        uses: actions/checkout@v4
        with:
          ref: agent/v2-modernization-phase1
          fetch-depth: 0

      - name: Apply finance workspace and audit hardening
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server/entityRouters.ts')
          s = p.read_text()
          old = '''  updateStatus: protectedProcedure
    .input(z.object({ id: z.number(), oldStatus: z.string(), newStatus: z.string(), notes: z.string().optional() }))
    .mutation(async ({ ctx, input }) => {
      const wsId = await requireFinanceWrite(ctx);
      await updateInvoice(input.id, wsId, { status: input.newStatus } as any);
      await addInvoiceStatusHistory({ invoiceId: input.id, oldStatus: input.oldStatus, newStatus: input.newStatus, changedBy: ctx.user.id, notes: input.notes });
      try { await logAudit(wsId, ctx.user.id, "delete", "invoices", input.id, null); } catch {}
      return { success: true };
    }),
  statusHistory: protectedProcedure
    .input(z.object({ invoiceId: z.number() }))
    .query(async ({ input }) => {
      return getInvoiceStatusHistory(input.invoiceId);
    }),
  paymentLinks: protectedProcedure
    .input(z.object({ invoiceId: z.number() }))
    .query(async ({ input }) => {
      return getPaymentLinksForInvoice(input.invoiceId);
    }),
  linkPayment: protectedProcedure
    .input(z.object({ invoiceId: z.number(), paymentId: z.number(), amount: z.string() }))
    .mutation(async ({ input, ctx }) => {
      const wsId = await requireWrite(ctx);
      try { await logAudit(wsId, ctx.user.id, "create", "invoicePaymentLink", 0, input); } catch {}
      return linkPaymentToInvoice(input);
    }),'''
          new = '''  updateStatus: protectedProcedure
    .input(z.object({ id: z.number(), oldStatus: z.string(), newStatus: z.string(), notes: z.string().optional() }))
    .mutation(async ({ ctx, input }) => {
      const wsId = await requireFinanceWrite(ctx);
      const invoice = await getInvoiceById(input.id, wsId);
      if (!invoice) throw new Error("Invoice not found in workspace");
      await updateInvoice(input.id, wsId, { status: input.newStatus } as any);
      await addInvoiceStatusHistory({ invoiceId: input.id, oldStatus: input.oldStatus, newStatus: input.newStatus, changedBy: ctx.user.id, notes: input.notes });
      try { await logAudit(wsId, ctx.user.id, "update", "invoices", input.id, { oldStatus: input.oldStatus, newStatus: input.newStatus, notes: input.notes }); } catch {}
      return { success: true };
    }),
  statusHistory: protectedProcedure
    .input(z.object({ invoiceId: z.number() }))
    .query(async ({ ctx, input }) => {
      const wsId = await getWorkspaceId(ctx);
      const invoice = await getInvoiceById(input.invoiceId, wsId);
      if (!invoice) throw new Error("Invoice not found in workspace");
      return getInvoiceStatusHistory(input.invoiceId);
    }),
  paymentLinks: protectedProcedure
    .input(z.object({ invoiceId: z.number() }))
    .query(async ({ ctx, input }) => {
      const wsId = await getWorkspaceId(ctx);
      const invoice = await getInvoiceById(input.invoiceId, wsId);
      if (!invoice) throw new Error("Invoice not found in workspace");
      return getPaymentLinksForInvoice(input.invoiceId);
    }),
  linkPayment: protectedProcedure
    .input(z.object({ invoiceId: z.number(), paymentId: z.number(), amount: z.string() }))
    .mutation(async ({ input, ctx }) => {
      const wsId = await requireFinanceWrite(ctx);
      const [invoice, payment] = await Promise.all([
        getInvoiceById(input.invoiceId, wsId),
        getPaymentById(input.paymentId, wsId),
      ]);
      if (!invoice) throw new Error("Invoice not found in workspace");
      if (!payment) throw new Error("Payment not found in workspace");
      try { await logAudit(wsId, ctx.user.id, "create", "invoicePaymentLink", 0, input); } catch {}
      return linkPaymentToInvoice(input);
    }),'''
          if old not in s:
              raise SystemExit('Expected invoice router block not found; aborting without changes')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Add regression coverage
        shell: bash
        run: |
          cat > server/entityRouters.workspaceSecurity.test.ts <<'EOF'
          import { describe, expect, it } from "vitest";
          import { readFileSync } from "node:fs";

          describe("finance router workspace isolation", () => {
            const source = readFileSync(new URL("./entityRouters.ts", import.meta.url), "utf8");

            it("validates invoice workspace before exposing status history", () => {
              expect(source).toContain("const invoice = await getInvoiceById(input.invoiceId, wsId);");
              expect(source).toContain("return getInvoiceStatusHistory(input.invoiceId);");
            });

            it("validates invoice workspace before exposing payment links", () => {
              expect(source).toContain("return getPaymentLinksForInvoice(input.invoiceId);");
              expect(source).toContain('if (!invoice) throw new Error("Invoice not found in workspace")');
            });

            it("validates both records before linking a payment", () => {
              expect(source).toContain("getPaymentById(input.paymentId, wsId)");
              expect(source).toContain('if (!payment) throw new Error("Payment not found in workspace")');
            });

            it("records invoice status changes as updates, not deletes", () => {
              expect(source).toContain('logAudit(wsId, ctx.user.id, "update", "invoices", input.id');
            });
          });
          EOF

      - name: Enable pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate

      - name: Install and prepare test database
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          npx drizzle-kit migrate

      - name: Validate modernization batch
        shell: bash
        run: |
          pnpm check
          RESEND_API_KEY= pnpm test
          pnpm build

      - name: Remove one-shot workflow and commit batch
        shell: bash
        run: |
          rm .github/workflows/phase1-finance-hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(finance): enforce workspace isolation for invoice history and payment links'
          git push origin HEAD:agent/v2-modernization-phase1
