name: One-time proposal hook-order repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair ProposalDetail hook order
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('client/src/pages/ProposalDetail.tsx')
          text = path.read_text()

          late = """  // Track this record as recently viewed\n  useEffect(() => {\n    if (proposal && proposalId) {\n      addRecord({ type: 'proposal', id: proposalId, title: proposal.title, route: `/app/proposals/${proposalId}` });\n    }\n  }, [proposal?.id]);\n\n"""

          anchor = """  const updateStatusMutation = trpc.proposals.updateStatus.useMutation();\n  const convertToContractMutation = trpc.proposals.convertToContract.useMutation();\n\n"""

          early = """  const updateStatusMutation = trpc.proposals.updateStatus.useMutation();\n  const convertToContractMutation = trpc.proposals.convertToContract.useMutation();\n\n  // Hooks must run before any conditional return. Track the record only after data exists.\n  useEffect(() => {\n    if (proposal && proposalId) {\n      addRecord({ type: 'proposal', id: proposalId, title: proposal.title, route: `/app/proposals/${proposalId}` });\n    }\n  }, [proposal?.id, proposalId, proposal?.title, addRecord]);\n\n"""

          if late not in text:
              raise SystemExit('Expected late useEffect block was not found; refusing to modify the file.')
          if anchor not in text:
              raise SystemExit('Expected mutation anchor was not found; refusing to modify the file.')

          text = text.replace(anchor, early, 1)
          text = text.replace(late, '', 1)
          path.write_text(text)
          PY

      - name: Verify TypeScript and tests
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate
          pnpm install --frozen-lockfile
          pnpm check
          env -u RESEND_API_KEY pnpm test
          pnpm build

      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/src/pages/ProposalDetail.tsx
          if git diff --cached --quiet; then
            echo 'No repair needed.'
          else
            git commit -m 'fix(proposals): keep hooks before conditional returns'
            git push origin HEAD:main
          fi
