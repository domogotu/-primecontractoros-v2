name: One-time proposals status filter repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair proposals status filtering
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('client/src/pages/Proposals.tsx')
          text = path.read_text()
          old = '''  const filteredProposals = proposals.filter((p) =>\n    p.title.toLowerCase().includes(searchTerm.toLowerCase())\n  );\n'''
          new = '''  const normalizedSearch = searchTerm.trim().toLowerCase();\n  const filteredProposals = proposals.filter((p) => {\n    if (!normalizedSearch) return true;\n    const title = p.title.toLowerCase();\n    const status = (p.status || 'draft').toLowerCase();\n    const readableStatus = status.replace(/_/g, ' ');\n    return title.includes(normalizedSearch) || status.includes(normalizedSearch) || readableStatus.includes(normalizedSearch);\n  });\n'''
          if old not in text:
              raise SystemExit('Expected proposal filter block was not found; refusing to modify the file.')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/src/pages/Proposals.tsx
          if git diff --cached --quiet; then
            echo 'No repair needed.'
          else
            git commit -m 'fix(proposals): make status actions filter the pipeline correctly'
            git push origin HEAD:main
          fi
