name: Phase 5 proposal carry-forward lineage fix

on:
  push:
    branches:
      - agent/phase5-proposal-carry-forward
    paths:
      - .github/workflows/phase5-proposal-carry-forward-fix.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: primecontractoros_test
          MYSQL_USER: user
          MYSQL_PASSWORD: pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uuser -ppass"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: mysql://user:pass@127.0.0.1:3306/primecontractoros_test
      JWT_SECRET: phase5-validation-only
      VITE_APP_ID: phase5-validation
      OAUTH_SERVER_URL: https://example.invalid
      VITE_OAUTH_PORTAL_URL: https://example.invalid
      OWNER_OPEN_ID: phase5-owner
      OWNER_NAME: Phase5 Owner
      OPENAI_API_KEY: sk-test-dummy
      SAM_GOV_API_KEY: phase5-test
      STRIPE_SECRET_KEY: sk_test_phase5
      STRIPE_PUBLISHABLE_KEY: pk_test_phase5
      STRIPE_WEBHOOK_SECRET: whsec_phase5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase5-proposal-carry-forward
          fetch-depth: 0
      - name: Apply Phase 5 patch with nullable-note fix
        run: python scripts/phase5_apply_fix.py
      - name: Verify Phase 5 source assertions
        run: |
          grep -q 'reusedExisting: !created' server/routers.ts
          grep -q 'sourceType: "sam.gov_attachment"' server/routers.ts
          grep -q 'autoPopulationEvents' server/routers.ts
          grep -q 'checkPlanLimit(wsId, "proposals", existingProposals.length)' server/routers.ts
          grep -q 'isNullOp(notesTbl.title)' server/routers.ts
      - run: corepack enable && corepack prepare pnpm@10.4.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm drizzle-kit migrate
      - run: pnpm check
      - run: env -u RESEND_API_KEY pnpm test
      - run: pnpm build
      - name: Commit verified Phase 5 changes without temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase5-proposal-carry-forward.yml .github/workflows/phase5-proposal-carry-forward-fix.yml scripts/phase5_apply.py scripts/phase5_apply_fix.py
          git add server/routers.ts server/phase5ProposalCarryForward.test.ts
          git commit -m "feat(phase5): make proposal carry-forward idempotent and traceable"
          git push origin HEAD:agent/phase5-proposal-carry-forward
